<!-- 링크 미리보기 카드. 여기 걸린 주소는 **스크래퍼가 가져가는 것**이지
     페이지가 불러오는 리소스가 아니다. 오프라인 동작은 그대로다. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="돌려본 것들">
<meta property="og:locale" content="ko_KR">
<meta property="og:url" content="https://kzhxxn.github.io/engineering-lab/">
<meta property="og:title" content="돌려본 것들 · 직접 돌려서 남긴 기록">
<meta property="og:description" content="겪을 법한 장애를 최소 형태로 재현하고, 막을 방법들을 같은 조건에서 나란히 재본 기록. 여기 있는 수치는 인용이 아니라 직접 돌려서 나온 값이다.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="돌려본 것들 · 직접 돌려서 남긴 기록">
<meta name="twitter:description" content="겪을 법한 장애를 최소 형태로 재현하고, 막을 방법들을 같은 조건에서 나란히 재본 기록.">
<meta name="twitter:image" content="https://kzhxxn.github.io/engineering-lab/og.png">
<style>
  /* ══ tokens ═══════════════════════════════════════════════════════════
     editorial technical notebook. 무채색 + Steel + Annotation 둘뿐.
     semantic color를 늘리지 않는다. 상태는 타이포와 문장으로 말한다.
     웹폰트는 로드하지 않는다(의존성 0). Pretendard가 깔려 있으면 쓰고,
     없으면 Apple SD Gothic Neo로 떨어진다. */
  :root{
    --paper:#faf8f4; --surface:#ffffff; --surface-2:#f4f1eb;
    --ink:#1c1b18; --ink-2:#4a4741; --muted:#78746d;
    --line:#e6e1d9; --line-2:#efebe4;
    --steel:#3f89ad; --steel-ink:#5ba3c7; --steel-wash:#eaf3f8;
    --amber:#b07d33; --amber-ink:#d39a4a; --amber-wash:#f8f0e2;
    --danger:#a2453a; --danger-wash:#f7e9e6;
    /* JetBrains Mono에는 한글이 없다. 생략하면 한글만 엉뚱한 폰트로 떨어져
       "0명"의 0과 명이 따로 논다. 스택 끝에 한글 sans를 붙여 글리프 단위로 넘긴다. */
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
           Pretendard,"Apple SD Gothic Neo",monospace;
    --sans:Pretendard,"Pretendard Variable","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
    --side:264px; --read:62ch; --col:820px; --toc:212px;
    --sec:88px;   /* section 간격 */
    --r:7px;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0b1117; --surface:#131c25; --surface-2:#18222d;
      --ink:#e5e9ed; --ink-2:#b3bcc5; --muted:#7d8892;
      --line:#25313d; --line-2:#1c2731;
      --steel:#5ba3c7; --steel-ink:#7cbbdb; --steel-wash:#12262f;
      --amber:#d39a4a; --amber-ink:#e0ad63; --amber-wash:#2c2418;
      --danger:#cf7264; --danger-wash:#2e1a17;
    }
  }
  :root[data-theme="dark"]{
    --paper:#0b1117; --surface:#131c25; --surface-2:#18222d;
    --ink:#e5e9ed; --ink-2:#b3bcc5; --muted:#7d8892;
    --line:#25313d; --line-2:#1c2731;
    --steel:#5ba3c7; --steel-ink:#7cbbdb; --steel-wash:#12262f;
    --amber:#d39a4a; --amber-ink:#e0ad63; --amber-wash:#2c2418;
    --danger:#cf7264; --danger-wash:#2e1a17;
  }

  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
       font-size:17px; line-height:1.85; -webkit-font-smoothing:antialiased;
       word-break:keep-all; overflow-wrap:break-word}
  pre,code,.mono,.log,.op{word-break:normal}
  svg{flex:none}
  ::selection{background:var(--steel-wash); color:var(--ink)}
  :focus-visible{outline:1.5px solid var(--steel); outline-offset:3px; border-radius:2px}
  /* 라벨 · metadata: 한글이 모노로 떨어지지 않게 전부 sans */
  .lbl,.crumb,.stat .k,.grp>h4,.pill,.hint,.card h3,.field>label,.demo-tag,.pg .dir,.meta,
  .find kbd,.siderail .lbl,.gsec>h2,.hero .kick{
    font-family:var(--sans); font-size:11.5px; letter-spacing:.07em; text-transform:uppercase;
    font-weight:600; color:var(--muted)}
  /* 숫자·코드·실험 데이터만 모노 */
  .num,.stat .v,.big,.vl,.sc,pre,code,.log,.op,.rail-label,.card table,.bar .nm{font-family:var(--mono)}

  .prog{position:fixed; top:0; left:0; height:2px; width:0; background:var(--steel);
        z-index:40; transition:width .1s linear; opacity:.8}

  /* ══ shell ══ */
  .shell{display:grid; grid-template-columns:var(--side) minmax(0,1fr); min-height:100vh}

  /* ══ sidebar: IDE explorer처럼 보이지 않게 ══ */
  aside{border-right:1px solid var(--line); background:transparent; position:sticky; top:0;
        height:100vh; display:flex; flex-direction:column}
  .brand{display:block; padding:38px 26px 22px; text-decoration:none; color:inherit}
  .brand .n{font-size:17px; font-weight:600; letter-spacing:-.02em; display:block;
            transition:color .15s; line-height:1.4}
  .brand:hover .n{color:var(--steel)}
  .brand .s{font-size:12.5px; color:var(--muted); margin-top:6px; display:block;
            line-height:1.6; letter-spacing:0; text-transform:none; font-weight:400}
  .mark{display:none}

  .find{position:relative; padding:0 26px 18px}
  .find svg{position:absolute; left:26px; top:8px; color:var(--muted); pointer-events:none}
  .find input{width:100%; font:inherit; font-size:13.5px; font-family:var(--sans);
              padding:3px 30px 7px 20px; border:0; border-bottom:1px solid var(--line);
              background:transparent; color:var(--ink); border-radius:0}
  .find input::placeholder{color:var(--muted)}
  .find input:focus{outline:0; border-bottom-color:var(--steel)}
  .find kbd{position:absolute; right:26px; top:5px; font-size:10.5px; letter-spacing:.04em;
            color:var(--muted); pointer-events:none; text-transform:none}
  .find input:focus + kbd{display:none}

  nav{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:32px;
      padding:10px 26px 36px; scrollbar-width:thin}
  .grp>h4{margin:0 0 10px; padding:0; font-size:10.5px; letter-spacing:.14em}
  .grp .c{display:none}
  .grp a{display:grid; grid-template-columns:22px 1fr; gap:6px; padding:5px 0 5px 11px;
         text-decoration:none; color:var(--ink-2); font-size:14px; line-height:1.5;
         border-left:1.5px solid transparent; transition:color .14s,border-color .14s}
  .grp a .i{font-family:var(--mono); font-size:10.5px; color:var(--muted); opacity:.65;
            font-variant-numeric:tabular-nums; line-height:1.9}
  .grp a:hover{color:var(--ink)}
  .grp a.on{color:var(--steel); border-left-color:var(--steel); font-weight:600}
  .grp a.on .i{color:var(--steel); opacity:.8}
  .empty{font-size:13px; color:var(--muted)}

  .siderail{padding:14px 26px 22px; display:flex; align-items:center;
            justify-content:space-between; gap:8px}
  .siderail .lbl{font-size:10.5px}
  .ico{appearance:none; background:transparent; border:0; color:var(--muted);
       padding:4px; cursor:pointer; display:grid; place-items:center; transition:color .14s}
  .ico:hover{color:var(--ink)}

  /* ══ article ══ */
  /* 본문과 목차를 한 그리드에 둔다. DOM 순서는 목차가 먼저인데, 좁은 화면에서 목차가
     위로 가야 하기 때문이다. 넓은 화면에서는 grid-column 으로 오른쪽에 앉힌다. */
  main{padding:86px 0 140px; padding-inline:64px; min-width:0;
       display:grid; grid-template-columns:minmax(0,var(--col)) var(--toc); gap:0 56px;
       align-items:start; max-width:calc(var(--col) + var(--toc) + 56px + 128px)}
  main.solo{grid-template-columns:minmax(0,1fr); max-width:calc(var(--col) + 128px)}
  .art-head{grid-column:1; grid-row:1; min-width:0}
  .art{grid-column:1; grid-row:2; min-width:0}
  main.solo .art{grid-row:auto}
  .topbar{display:none}

  /* ══ 주제 태그 ══ */
  .tagbar{display:flex; flex-wrap:wrap; gap:0 22px; align-items:baseline;
          padding-bottom:12px; max-width:var(--col)}
  .tagbar+.tagbar{padding-top:10px; border-top:1px solid var(--line-2)}
  .tagbars{margin:0 0 var(--sec); padding-bottom:2px; max-width:var(--col);
           border-bottom:1px solid var(--line-2)}
  .tagbar.techrow button{font-family:var(--mono); font-size:12.5px}
  .tagnote{font-size:14.5px; color:var(--muted); line-height:1.7;
           margin:calc(var(--sec) * -0.6) 0 var(--sec); max-width:var(--read)}
  .tagbar .lbl{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
               color:var(--muted); font-family:var(--sans); font-weight:600; margin-right:4px}
  .tagbar button{background:none; border:0; padding:6px 0; cursor:pointer; font:inherit;
                 font-size:14px; color:var(--muted); transition:color .14s}
  .tagbar button:hover{color:var(--ink-2)}
  .tagbar button.on{color:var(--ink); font-weight:600}
  .tagbar button .n{font-family:var(--mono); font-size:11px; color:var(--line); margin-left:5px}
  .tagbar button.on .n{color:var(--steel)}
  .pill.tech{font-family:var(--mono); font-size:11.5px; letter-spacing:0;
             text-transform:none; color:var(--muted)}
  .tile:hover .pill.tech{color:var(--ink-2)}
  .pill.tag{font-size:13.5px; letter-spacing:-.005em; text-transform:none;
            font-family:var(--sans); color:var(--ink-2); font-weight:500}
  .tile:hover .pill.tag{color:var(--ink)}

  /* ══ 가로지르는 한 편 ══ */
  .lead{display:block; text-decoration:none; color:inherit; max-width:var(--col);
        margin:0 0 var(--sec); padding:22px 0 24px;
        border-top:2px solid var(--steel); border-bottom:1px solid var(--line-2)}
  .lead .lbl{display:block; font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
             color:var(--steel); font-family:var(--sans); font-weight:600; margin-bottom:12px}
  .lead .t{display:block; font-size:24px; font-weight:600; letter-spacing:-.028em;
           color:var(--ink); line-height:1.4; transition:color .15s}
  .lead:hover .t{color:var(--steel)}
  .lead .why{display:block; font-size:15px; color:var(--muted); line-height:1.72;
             margin-top:10px; max-width:var(--read)}

  /* ══ 처음 온 사람을 위한 세 편 ══ */
  .first{margin:0 0 var(--sec); max-width:var(--col)}
  .first .lbl{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase; color:var(--muted);
              font-family:var(--sans); font-weight:600; padding-bottom:12px;
              border-bottom:1px solid var(--line-2); display:block}
  .first a{display:block; padding:16px 0; border-bottom:1px solid var(--line-2);
           text-decoration:none; color:inherit}
  .first a:last-child{border-bottom:0}
  .first .t{display:block; font-size:17px; font-weight:600; letter-spacing:-.022em;
            color:var(--ink); transition:color .15s}
  .first a:hover .t{color:var(--steel)}
  .first .why{display:block; font-size:14.5px; color:var(--muted); line-height:1.65; margin-top:5px}

  /* ══ 목차 ══ */
    /* -1 은 명시적 행이 있을 때만 마지막 줄을 가리킨다. 여기는 전부 암시적 행이라
     1 / -1 이 1행으로 접히고, 그러면 목차 높이만큼 1행이 늘어나 수치가 밀린다. */
  .toc{grid-column:2; grid-row:1 / span 2; position:sticky; top:86px; align-self:start;
       max-height:calc(100vh - 140px); overflow-y:auto; overscroll-behavior:contain}
  /* details/summary 를 쓰려면 summary 의 display 를 건드려야 하는데, 그 순간 Chrome 이
     summary 를 평범한 상자로 취급해 토글이 죽는다. 그래서 버튼으로 직접 여닫는다. */
  .toc .lbl{font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
            color:var(--muted); font-family:var(--sans); font-weight:600;
            padding:0 0 12px; margin-bottom:4px; border:0;
            border-bottom:1px solid var(--line-2); background:none; width:100%;
            cursor:pointer; display:flex; align-items:center; gap:8px; text-align:left}
  .toc .lbl:hover{color:var(--ink-2)}
  .toc .lbl .n{margin-left:auto; font-size:10px; color:var(--line); letter-spacing:.06em}
  .toc .lbl .cv{display:none; width:9px; height:9px; border-right:1.5px solid var(--muted);
                border-bottom:1.5px solid var(--muted); transform:rotate(45deg) translate(-2px,-2px);
                transition:transform .18s}
  .toc:not(.closed) .lbl .cv{transform:rotate(-135deg) translate(-3px,-3px)}
  .toc.closed ol{display:none}
  .toc ol{list-style:none; margin:0; padding:0; counter-reset:toc}
  .toc li{margin:0; counter-increment:toc}
  .toc a{display:grid; grid-template-columns:20px 1fr; gap:9px; padding:10px 0 11px;
         text-decoration:none; color:var(--muted); font-size:13px; line-height:1.62;
         letter-spacing:-.005em; transition:color .14s}
  .toc a::before{content:counter(toc,decimal-leading-zero); font-family:var(--mono);
                 font-size:10.5px; color:var(--line); padding-top:2px; transition:color .14s}
  .toc a:hover{color:var(--ink-2)}
  .toc a.on{color:var(--ink); font-weight:600}
  .toc a.on::before{color:var(--steel)}

  .crumb{margin-bottom:18px; font-size:11px; letter-spacing:.13em}
  .crumb .dot{display:none}
  h1{font-family:var(--sans); font-size:clamp(31px,4.1vw,40px); font-weight:600;
     letter-spacing:-.032em; margin:0 0 24px; text-wrap:balance; line-height:1.35; color:var(--ink)}
  .lede{color:var(--ink-2); max-width:var(--read); margin:0 0 44px; font-size:18px;
        line-height:1.8; font-weight:400}
  .lede strong{color:var(--ink); font-weight:600}
  .rule{height:1px; background:var(--line); border:0; margin:0 0 52px; max-width:var(--col)}

  /* ══ 측정 요약: 카드가 아니라 divider로 나눈 한 줄 ══ */
  .strip{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
         margin:0 0 var(--sec); border-top:1px solid var(--line);
         border-bottom:1px solid var(--line); max-width:var(--col)}
  .stat{padding:20px 26px 22px; display:flex; flex-direction:column; gap:7px;
        border-left:1px solid var(--line-2)}
  .stat:first-child{border-left:0; padding-left:0}
  .stat .k{font-size:10.5px}
  .stat .v{font-size:27px; font-weight:600; font-variant-numeric:tabular-nums;
           letter-spacing:-.035em; line-height:1.1; color:var(--ink)}
  .stat .v.bad{color:var(--danger)}
  .stat .v.good,.stat .v.acc{color:var(--ink)}
  .stat .d{font-size:12.5px; color:var(--muted); line-height:1.55; letter-spacing:0;
           text-transform:none; font-weight:400}

  /* ══ prose: 가능한 한 flat ══ */
  h2{font-family:var(--sans); font-size:21px; letter-spacing:-.022em; color:var(--ink);
     margin:var(--sec) 0 20px; font-weight:600; line-height:1.5; scroll-margin-top:80px;
     max-width:var(--read)}
  p{margin:0 0 22px; max-width:var(--read); color:var(--ink-2)}
  p strong{color:var(--ink); font-weight:600}
  ul{margin:0 0 22px; padding-left:20px; color:var(--ink-2); max-width:var(--read)}
  li{margin-bottom:10px}
  li::marker{color:var(--muted)}
  a{color:var(--steel)}
  code{font-size:.84em; background:var(--surface-2); padding:1.5px 5px; border-radius:4px;
       color:var(--ink)}

  /* ══ surface: 실제 기능이 있는 영역만 ══ */
  pre{font-size:12.5px; background:var(--surface); border:1px solid var(--line);
      border-radius:var(--r); padding:18px 20px; overflow-x:auto; margin:0 0 30px;
      color:var(--ink-2); line-height:1.7; max-width:var(--col)}
  pre b{color:var(--ink); font-weight:600}
  pre code{background:none; padding:0}

  .tblwrap{overflow-x:auto; margin:0 0 30px; border-top:1px solid var(--line);
           border-bottom:1px solid var(--line); max-width:var(--col)}
  table{border-collapse:collapse; width:100%; font-size:14px}
  th,td{text-align:left; padding:11px 16px 11px 0; border-bottom:1px solid var(--line-2)}
  th{font-family:var(--sans); font-size:10.5px; letter-spacing:.11em; text-transform:uppercase;
     color:var(--muted); font-weight:600; white-space:nowrap;
     border-bottom:1px solid var(--line); padding-top:14px; padding-bottom:12px}
  td{color:var(--ink-2); font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}

  figure{margin:0 0 34px; padding:6px 0 0; background:none; border:0; max-width:var(--col)}
  figure svg{display:block; max-width:100%; height:auto; margin:0 auto}
  figcaption{font-size:13px; color:var(--muted); margin:22px auto 0; padding-top:16px;
             border-top:1px solid var(--line-2); line-height:1.7; max-width:var(--read);
             text-align:left}

  /* 주석: 박스가 아니라 왼쪽 마커 */
  .note{border-left:1.5px solid var(--amber); background:none; padding:2px 0 2px 22px;
        border-radius:0; margin:0 0 30px; font-size:16px; color:var(--ink-2); max-width:var(--read)}
  /* 제목만 골라야 한다. `.note b` 로 잡으면 본문 안의 <b> 까지 제목 스타일이 먹어서
     문장이 토막나 보인다. 제목은 언제나 첫 자식이다. */
  .note > b:first-child{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; display:block;
          margin-bottom:8px; color:var(--amber); font-family:var(--sans); font-weight:600}
  .honest{border-left:1.5px solid var(--line); background:none; padding:2px 0 2px 22px;
          border-radius:0; margin:0 0 30px; font-size:15.5px; color:var(--muted); max-width:var(--read)}
  .honest > b:first-child{font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; display:block;
            margin-bottom:8px; color:var(--muted); font-family:var(--sans); font-weight:600}

  /* ══ interactive demo: 여기만 panel ══ */
  .demo-tag{display:flex; align-items:center; gap:10px; margin-bottom:14px; font-size:10.5px;
            letter-spacing:.14em; color:var(--steel)}
  .demo-tag::before{content:''; width:5px; height:5px; border-radius:50%;
                    background:var(--steel); flex:none}
  .demo-tag::after{content:''; flex:1; height:1px; background:var(--line); max-width:220px}
  .demo{background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
        padding:26px; display:flex; flex-direction:column; gap:22px; margin-bottom:var(--sec);
        max-width:var(--col); font-size:15px}

      ['p','그럼 서버는 토큰을 어디서 읽나. 서버 렌더링 컨텍스트에서 각 보관소에 접근해봤다.'],
      ['pre','① localStorage      | ✗ ReferenceError: localStorage is not defined\n② 클라이언트 메모리 | ✗ 서버에는 그 객체가 존재하지 않는다 (프로세스가 다르다)\n③ 쿠키              | ✓ 요청 헤더로 도착: session=abc123'],
      ['p','서버가 읽을 수 있는 것은 요청에 실려 온 것뿐이다. 보안 요구(JS 접근 차단)와 기술 제약(서버 접근 가능)이 같은 답을 가리킨다. 쿠키다. 흔히 "보안 때문에 쿠키"라고 말하지만, 사실은 <strong>그것 말고 양쪽을 만족시키는 곳이 없다.</strong>'],
      ['tbl','보관 위치|JS 접근 차단|SSR이 읽기|판정;localStorage|✗|✗|둘 다 실패;메모리(스토어)|✗|✗|새로고침에 소실까지;쿠키(일반)|✗|✓|절반;<b>쿠키(HttpOnly)</b>|<b>✓</b>|<b>✓</b>|<b>유일</b>'],

      ['h2','로그인 안 한 curl에 급여 데이터가 그대로 왔다'],
      ['p','토큰이 서버에 있으니 인증 판단도 서버에 두는 게 자연스럽다. 그런데 그 전에, 클라이언트에 두면 왜 안 되는지를 확인해둘 필요가 있었다. "보안상 좋지 않다"는 결론이지 이유가 아니기 때문이다.'],
      ['pre','$ curl -s http://localhost:4001/ | grep 메모\n  &lt;p&gt;메모: &lt;b&gt;급여명세-2026-09&lt;/b&gt;&lt;/p&gt;'],
      ['p','로그인하지 않은 요청에 보호 데이터가 그대로 왔다. 브라우저는 이걸 받은 뒤에 JS로 지우므로 화면상으로는 멀쩡하다. <code>curl</code>에는 애초에 JS가 없으니 지울 것도 없다. <strong>판단이 응답보다 뒤에 있으면 그것은 경계가 아니다.</strong>'],
      ['p','토큰을 숨기려고 시작한 일이 여기서 데이터 은닉까지 같이 해결한다. 원래 목적은 토큰이었는데 보호 데이터도 함께 안 나가게 된 셈이다.'],

      ['h2','한 곳에 모았는데 갱신은 여전히 열 번 나갔다'],
      ['p','토큰이 서버에 있고 헤더도 서버가 붙인다면, <strong>만료됐을 때 갱신하는 것도 서버다.</strong> 그런데 서버 컴포넌트도 부르고 클라이언트 컴포넌트도 부른다. 각자 401을 만나 각자 갱신하면 어떻게 되는지 재봤다.'],
      ['demo','동시 요청 수를 바꿔보기'],
      ['tbl','갱신 책임|refresh 호출|성공;① 호출부마다 각자|<b>10회</b>|10/10;② 한 곳에 모음 · 합치지 않음|<b>10회</b>|10/10;③ 한 곳에 모음 · 갱신 합치기|<b>1회</b>|10/10'],
      ['p','N=1·3·10·25·50에서 전부 ①②는 N, ③은 1이었다. 여기서 예상이 깨졌다. ②가 ①과 같다. 토큰을 한 곳으로 모았는데도 갱신은 여전히 10번 나간다. 요청마다 독립적으로 401을 만나 각자 갱신하기 때문이다.'],
      ['note','모으는 것과 고치는 것은 다른 일이다|"한 곳에 모으면 해결된다"는 틀렸다. 모아서 얻는 것은 해결이 아니라 <b>고칠 수 있는 자리</b>다. ③은 그 자리에서 <b>갱신을 합치는 코드</b>(진행 중인 갱신이 있으면 그것을 함께 기다린다)를 넣은 결과이고, 이건 <b>모은 뒤에야 쓸 수 있는 코드</b>다. 호출부가 흩어져 있으면 이 자리 자체가 없다.'],

      ['h2','합치기는 프로세스를 못 넘는다'],
      ['p','③을 만들고 나서 한 가지가 걸렸다. 합치기는 <strong>진행 중인 갱신을 가리키는 변수를 공유하기 때문에</strong> 동작한다. 그 변수는 프로세스 안에 있다. 서버를 여러 대 띄우면 어떻게 되나.'],
      ['tbl','배치|refresh 호출;③ BFF 1대 · 갱신 합치기|1회;④ BFF 2대 · 각자 합치기|<b>2회</b>;⑤ BFF 4대 · 각자 합치기|<b>4회</b>'],
      ['p','인스턴스 수만큼 갈라진다. 각 인스턴스는 자기 진행 상태만 보기 때문이다. 실무에서 BFF를 한 대만 띄우는 경우는 드물다. 그러니 이 랩의 "1회"는 프로세스가 하나라서 나온 숫자다.'],
      ['p','여기서부터는 갱신 상태를 프로세스 밖으로 빼야 한다. 공유 캐시에 잠금을 걸거나, 갱신 전담 워커를 두거나, 아니면 토큰 수명을 길게 잡아 동시 만료 자체를 줄이거나. 셋 다 새로운 복잡도를 들여온다. 이건 아직 안 풀었다.'],
      ['honest','그래서 이 수치를 어떻게 읽나|"BFF로 모으면 refresh가 1번이 된다"는 <b>절반만 맞다.</b> 정확히는 <b>인스턴스당 1번</b>이다. 10명이 각자 부르던 것이 인스턴스 수만큼으로 줄어든 것이고, 그 자체로도 큰 개선이지만 <b>1이 아니다.</b> 처음에 ③만 보고 "해결했다"고 적을 뻔했다.'],

      ['h2','미들웨어에서는 갱신을 못 짠다'],
      ['p','갱신을 서버에 모으기로 했다면 자리가 둘이다. 요청이 라우트에 닿기 전(미들웨어)인가, 라우트 안(핸들러)인가.'],
      ['p','미들웨어는 <strong>응답 본문을 읽고 가공할 수 없다.</strong> 401을 받아 갱신하고 재시도하는 로직은 여기서 못 짠다. 경로 접근 제어(리다이렉트)까지가 미들웨어의 자리이고, 갱신과 재시도는 그 뒤여야 한다. 둘을 같은 곳에 두려다 안 되는 이유가 여기 있다.'],
      ['tbl','|렌더 직전 가드|미들웨어;가드를 쓰는 곳|보호할 페이지마다|경로 목록 한 곳;빠뜨릴 수 있나|<b>있다</b>|어렵다;응답 본문 가공|가능|<b>불가</b>;세션 저장소 접근|자유|필요(엣지에서는 제약)'],
      ['p','경계를 앞으로 당길수록 판단에 쓸 재료가 줄어든다. 미들웨어를 엣지에 올리면 세션 저장소에 못 닿아 무상태 검증(서명 확인)으로 바뀐다. 그러면 <b>즉시 로그아웃·세션 강제 만료가 안 먹는다.</b> 빠른 자리일수록 판단에 쓸 수 있는 재료가 적다.'],

      ['h2','상류에 닿던 요청 50건이 0건이 됐다'],
      ['p','원래 목적은 토큰 은닉이었는데 부수로 따라온 게 있다. 미인증 요청 50개를 동시에 던지고 상류가 몇 번 불렸는지 셌다.'],
      ['tbl','배치|상류 호출|세션 검증;클라이언트 가드|<b>50회</b>|0회;서버 쪽 가드(어느 자리든)|<b>0회</b>|50회'],
      ['p','인증을 보지 않으면 미인증 50개가 그대로 상류 50회가 된다. 가드를 앞으로 옮기자 상류는 이 트래픽을 <strong>아예 모르게</strong> 됐다. 보안 결정의 부수 효과지 근거는 아니지만, "보안은 보안대로 부하는 인프라가" 하고 나누면 이 연결을 놓친다.'],

      ['h2','그래서 이렇게 풀었고, 여기가 남았다'],
      ['p','정리하면 이렇게 풀었다. 토큰은 <code>HttpOnly</code> 쿠키. 다른 선택지가 없었다. 헤더 주입·인증 판단·갱신은 전부 서버 쪽, 그중 갱신과 재시도는 응답을 가공할 수 있는 라우트 핸들러에. 경로 접근 제어는 미들웨어에 둬서 페이지가 늘어도 빠뜨릴 자리를 없앴다.'],
      ['p','안 풀린 것은 인스턴스가 여럿일 때의 동시 갱신이다. 갱신을 합치는 코드가 프로세스 경계를 못 넘는다. 그리고 이 랩에서 토큰 회전을 켜지 않았다. 갱신이 여러 번 나갔을 때 앞선 토큰이 무효화되어 서로를 밀어내는 상황은 확인하지 못했다. 회전을 켜면 ②와 ④·⑤가 지금보다 더 나쁠 수 있다.'],
      ['p','그리고 이 구조가 유일한 답이라고 생각하지 않는다. 토큰을 쿠키에 두면 CSRF를 따로 막아야 하고, 서버가 모든 요청 경로에 끼어들면 그 자체가 단일 장애점이 된다. 여기서 고른 것은 <strong>"XSS로 세션이 통째로 넘어가는 것"을 가장 무겁게 본 결과</strong>이고, 도메인이 달랐다면 다른 답이 나왔을 것이다.'],
      ['honest','범위 밖으로 둔 것|CSRF 방어, 쿠키 속성(<code>SameSite</code>·<code>Secure</code>), 로컬 개발 환경의 쿠키 제약(운영 도메인 쿠키를 로컬에서 못 쓰는 문제), 깜빡임, 스트리밍 SSR. 마지막은 특히 <b>이미 flush된 청크를 되돌릴 수 없어</b> 경계 논의가 통째로 달라진다. BFF 한 홉의 비용(1~2ms)도 로컬 루프백이라 실제 환경을 말해주지 못한다.'],
      ['p','시나리오는 서버 렌더링을 쓰는 서비스에서 <strong>인증 판단을 어디에 둘지 정해야 했던 상황</strong>에서 가져왔다. 서비스 이름과 경로는 쓰지 않았고 결정의 연쇄만 일반형으로 옮겼다.']
    ],meta:'Node 20 · 표준 http 모듈만 · refresh 호출 횟수는 N=1·3·10·25·50에서 결정적, 2회 반복 동일 · 2026-09-14'},
  'ime':{grp:'프론트엔드',t:'한글만 깨지는데 영문 테스트는 다 통과한다',crumb:'Chrome · IME 조합',tech:['React','브라우저','Node.js'],tags:['재현 조건'],
    lede:'이름 입력칸에서 한글이 깨진다는 제보가 들어왔다. 재현해보면 안드로이드 웹뷰 첫 입력에서 잘 난다. 그런데 <strong>테스트도 리뷰도 전부 통과한 변경</strong>이었다.',
    demo:'ime',
    body:[
      ['h2','처방은 아는데 왜 안 고쳐졌나'],
      ['p','"한글 입력이 깨진다"는 증상은 처방이 이미 널리 알려져 있다. <code>compositionstart</code>와 <code>compositionend</code>로 감싸라는 것이다. 그런데 그걸 외워 붙이면 비슷하지만 다른 상황에서 또 틀린다. 물어야 할 것은 셋이다.'],
      ['ul','한글을 칠 때 실제로 무엇이 몇 번 일어나나|그 왕복이 왜 조합을 깨나|그리고 <strong>왜 이게 테스트도 리뷰도 통과했나</strong>'],
      ['p','셋째가 이 글의 목적이다. 고치는 법보다 <strong>못 잡은 이유</strong>가 더 오래 쓸모 있다.'],

      ['h2','controlled input이 하는 왕복'],
      ['p','화면에 보이는 값이 컴포넌트 안이 아니라 전역 상태에서 내려오는 구조다. 입력이 들어오면 이 순서로 돈다.'],
      ['pre','입력 → 전역 상태에 커밋 → 리렌더 → input.value 를 상태값으로 다시 씀'],
      ['p','영어처럼 키 입력과 글자가 1:1인 언어에서는 이 왕복이 문제가 안 된다. 한 번 치면 한 번 돈다. 그런데 한글은 <code>ㄱ → 가 → 강</code>처럼 <strong>여러 키가 하나의 글자로 조합</strong>되고, 그 조합이 끝나기 전까지 브라우저 IME는 input 안에 임시 조합 문자를 들고 있다.'],
      ['fig','ime'],

      ['h2','한 글자에 커밋이 세 번 나간다'],
      ['p','프레임워크를 걷어내고 위의 왕복만 남긴 페이지를 만들어 세어봤다. <code>ㄱ → 가 → 강</code>으로 조합할 때다.'],
      ['demo','직접 조합해보기'],
      ['tbl','구현|커밋|리렌더;수정 전|<b>3회</b>|3회;수정 후|<b>1회</b>|1회;uncontrolled|3회|0회'],
      ['p','한 글자를 입력했는데 전역 상태가 세 번 바뀐다. 조합 중간값(<code>ㄱ</code>, <code>가</code>)까지 전부 커밋되기 때문이다. 그리고 커밋할 때마다 리렌더가 돌아 <strong><code>input.value</code>를 바깥에서 되쓴다</strong> 조합이 아직 끝나지 않았는데.'],

      ['h2','되쓰면 커서가 뒤로 밀린다'],
      ['p','브라우저 내부의 조합 버퍼는 직접 들여다볼 수 없다. 대신 되쓰기가 실제로 하는 일 하나는 그대로 관찰된다.'],
      ['pre','"서울시 |강남구"  (캐럿 4)\n  → 같은 값으로 되쓰기          → 캐럿 4  (유지)\n  → 한 글자 달라진 값으로 되쓰기  → 캐럿 8  (끝으로 점프)'],
      ['p','같은 값이면 브라우저가 건너뛴다. <strong>값이 조금이라도 달라지면 캐럿이 끝으로 간다.</strong> 커밋 경로에 정규화(길이 제한·허용 문자 필터·공백 정리)가 있으면, 그 함수가 값을 한 글자라도 바꾸는 순간 커서가 튄다. 조합 중이라면 그 자체로 파괴적이다.'],
      ['honest','여기까지가 잰 것이다|실제 IME 조합 버퍼가 깨지는 장면은 <b>재현하지 못했다.</b> 합성 이벤트를 쏘는 것은 브라우저 내부 IME 세션을 만들지 않는다. 확인해봤는데, 조합 중에 <code>value</code>를 덮어써도 취소 이벤트가 따라오지 않는다. 이 실험이 재는 것은 <b>커밋·리렌더 횟수와 캐럿 이동까지</b>이고, "그래서 조합이 깨진다"는 실제 기기에서 관찰된 것이지 여기서 재현한 것이 아니다.'],

      ['h2','영문으로 재면 고치기 전후가 똑같다'],
      ['p','같은 세 구현에 영문 <code>abc</code>를 넣어봤다.'],
      ['tbl','구현|한글 "강"|영문 "abc";수정 전|3회|3회;수정 후|<b>1회</b>|<b>3회</b>;uncontrolled|3회|3회'],
      ['p','영문에서는 <strong>수정 전과 수정 후가 완전히 같다.</strong> 영문은 조합 구간이 없어서 <code>isComposing</code>이 한 번도 참이 되지 않고, 그러면 수정된 분기를 아예 안 탄다.'],
      ['p','이게 답이다. 테스트를 영문으로 짜면 두 구현을 구분할 방법이 없다. 리뷰에서도 안 보인다 diff만 보면 "조합 처리를 추가했다"인데, 그게 무엇을 막는지는 한글로 직접 쳐봐야만 드러난다. 앞선 <a href="#race">레이스 실험</a>에서 본 것과 같은 모양이다. 초록불이 증거가 못 되는 조건이 따로 있다.'],

      ['h2','조합 중에는 전역 상태를 건드리지 않는다'],
      ['p','처방 자체는 간단하다. <strong>조합 중에는 전역 상태를 건드리지 않는다.</strong> 조합 중 표시값은 컴포넌트 안에 두고, 조합이 끝났다고 알려줄 때 딱 한 번 커밋한다.'],
      ['pre','value = 조합중인값 ?? 전역값'],
      ['p','조합 중에는 화면 값의 주인이 잠깐 로컬로 바뀐다. 그래서 바깥에서 리렌더가 나도 값이 조합 텍스트와 계속 붙어 있다. 조합이 끝나면 주인이 다시 전역으로 돌아온다.'],
      ['note','왜 하나는 ref이고 하나는 state인가|조합 여부는 <code>onChange</code> 안에서 <b>지금 이 순간</b> 읽어야 한다. state였다면 갱신이 다음 렌더까지 반영되지 않아 판단이 틀린다. 반대로 조합 중 표시값은 화면을 바꿔야 하므로 <b>리렌더를 유발하는 쪽</b>이어야 한다. 같은 "조합 상태"인데 <b>읽는 시점이 달라서</b> 그릇이 갈린다.'],

      ['tbl','이벤트 순서|수정 전|수정 후;compositionend로 끝|3회|<b>1회</b>;compositionend 뒤에 input 하나 더|4회|<b>2회</b>'],
      ['p','<code>compositionend</code>에서 커밋하는 구현이 환경에 따라 두 번 커밋한다. 값이 같으면 대개 무해하지만, 커밋이 서버 호출이나 로깅을 유발한다면 중복이 된다. 처방을 붙이고 끝낼 게 아니라 <strong>내 대상 환경에서 몇 번 도는지</strong>는 한 번 세어봐야 한다.'],

      ['h2','uncontrolled로 도망가면 잃는 것'],
      ['p','<strong>uncontrolled로 도망가는 것은 답이 아니다.</strong> 비교군을 같이 잰 이유가 그것이다. uncontrolled도 커밋은 3회로 똑같고, 줄어드는 건 리렌더(0회)뿐이다. 대신 전역 상태와 화면이 갈릴 수 있다. 조합 문제를 피하려다 동기화 문제를 얻는다.'],
      ['p','더 오래 남는 것은 테스트 언어가 곧 테스트 범위라는 사실이다. 다국어를 다루는 화면이라면 입력 테스트를 영문으로만 짜는 순간, 조합이 있는 언어에서만 나는 버그 전체가 사각지대가 된다. 한글·일본어·중국어가 전부 여기 들어간다.'],
      ['honest','재보지 않은 것|기기·입력기별 차이는 재지 않았다. 안드로이드 웹뷰, iOS, Windows IME가 보내는 이벤트 순서가 서로 다른데 여기서는 두 가지만 가정했다. 커밋 3회가 실제로 체감될 만큼 느린지(성능 영향)도 재지 않았다. 붙여넣기·자동완성처럼 <code>compositionstart</code> 없이 값이 바뀌는 경로에서 수정본이 올바른지도 확인이 필요하다.'],

  'xd':{grp:'도구',t:'내가 짜지 않은 코드가 내 PR로 올라간다',crumb:'Python · PR 전 이해 게이트',tech:['Python','Git'],tags:['경계 설계'],
    lede:'에이전트가 코드를 쓰고 같은 에이전트가 리뷰한다. 머지도 된다. 그런데 <strong>PR이 쌓일수록 내 저장소인데 내가 제일 모르는 상태</strong>로 간다. 코드는 남는데 이해가 안 남는다.',

      ['h2','PR 직전에 읽을거리로 바꾼다'],
      ['fig','xd'],
      ['p','PR을 올리기 <strong>직전</strong>, 변경을 <code>배경 → 직관 → 코드 → 퀴즈</code> 순서의 읽을거리로 재구성한다. 퀴즈 5문항을 전부 맞히면 완료 코드가 열리고, 그 코드를 붙여넣어야 다음으로 넘어간다. 통과하지 못하면 <code>git push</code>와 PR 생성이 훅에서 막힌다.'],

      ['h2','직접 해보는 게 빠르다'],
      ['p','아래는 실제로 쓰는 것과 같은 형식의 퀴즈다. 소재는 이 아카이브의 <a href="#ime">한글 조합 글</a>이니, 그걸 읽었다면 풀 수 있다. 읽었다고 생각하는데 안 풀린다면 그게 이 도구가 노리는 지점이다.'],

      ['p','답 위치는 문항마다 섞여 있다. <strong>"길이가 긴 게 정답"이나 "보통 세 번째"</strong> 같은 요령을 막기 위해서다. 그리고 틀려도 정답과 이유는 그 자리에서 보여준다. 막는 게 목적이 아니라 읽게 하는 게 목적이라서다.'],

      ['p','키를 무엇으로 잡을지가 유일하게 고민스러웠다. 커밋 SHA로 잡으면 <code>amend</code>·<code>rebase</code> 때마다 통과가 무효화된다. "변경이 달라졌으니 다시 이해하라"는 뜻이면 그건 기능이다. 그런데 워크트리 병렬 작업은 리베이스가 잦아서, 내용이 그대로인데도 매번 다시 풀게 된다.'],

      ['p','이 구분이 중요한 이유는, 자물쇠로 착각하면 엉뚱한 곳을 보강하게 되기 때문이다. 코드를 서버에서 발급하고 서명하고 만료를 걸고 싶어진다. 그런데 막으려는 대상이 <strong>공격자가 아니라 어제의 나</strong>라면 그 보강은 전부 헛돈다.'],

      ['h2','무엇을 못 하나'],

      ['p','그리고 작성자 본인에게만 걸린다. 남의 PR을 리뷰할 때 어떻게 끼울지는 정하지 않았다. 혼자 작업하는 지금은 이걸로 충분하지만, 서로의 PR을 리뷰하는 흐름이 되면 다시 볼 지점이다.'],

      ['note','빈도가 낮아 보이는 이유|에러 추적기는 메시지로 묶는다. 그러면 같은 결함이 <b>여러 이슈로 흩어져</b> 각각은 드문 것처럼 보인다. 합쳐 보기 전에는 우선순위가 낮게 잡힌다. "이 에러가 몇 건인가"를 묻기 전에 <b>"같은 원인인 다른 메시지가 있나"</b>를 먼저 물어야 하는 경우다.'],

      ['h2','한 겹 감싸면 경계가 생긴다'],
      ['tbl','라벨|자식 구성|기준 노드의 부모|결과;맨몸 텍스트|img, font|font (옮겨짐)|NotFoundError;[[lt]]span[[gt]]으로 감쌈|svg, span|<b>button (그대로)</b>|정상'],
      ['p','번역은 <code>&lt;span&gt;</code> 안쪽 텍스트를 감싼다. 기준 노드인 <code>&lt;span&gt;</code>은 여전히 버튼의 직계 자식이라 삽입이 성공한다. <strong>외부가 건드리는 층과 프레임워크가 기준으로 삼는 층을 분리</strong>한 것이다.'],
      ['p','다른 방법들도 재봤다.'],
      ['tbl','방법|되나|비용;라벨을 span으로 감싼다|✓|없음. DOM 한 겹;translate="no"|✓|그 부분이 번역되지 않는다;[[lt]]html lang[[gt]] 지정|부분적|오탐을 줄일 뿐, 켜면 그대로;타입 스왑을 없앤다(CSS 토글)|✓|아이콘 두 개를 항상 그린다;key를 준다|<b>✗</b>|기준 노드 문제라 형제 key로 안 풀린다'],
      ['p','마지막 줄이 중요하다. 리스트 렌더에서 배운 반사신경이 여기서는 안 통한다. key는 형제 중 무엇을 재사용할지의 문제고, 이건 기준 노드가 어디 있느냐의 문제다.'],

      ['h2','왜 화면 전체가 날아갔나'],
      ['p','에러 경계를 어디에 뒀느냐가 정한다.'],
      ['tbl','경계|한 번의 실패로 사라지는 것;루트 단일|<b>4개 섹션 전부</b>;섹션 단위|1개 섹션'],
      ['p','아이콘 하나를 못 바꾼 실패가 화면 전체를 폴백으로 바꾼다. <strong>입력해 둔 값도 같이 사라진다.</strong> 그리고 경계가 경로를 기준으로 리셋된다면, 같은 화면으로 돌아와도 리셋이 안 걸려서 사용자는 빠져나갈 길이 없다.'],
      ['p','경계 위치는 평소에 티가 안 난다. 이런 순간에만 드러나고, 그때는 이미 늦다.'],

      ['h2','쓰는 것과 가정을 아는 것의 차이'],
      ['p','고치는 법보다 오래 남는 것은 가정을 의식하는 습관이다. 프레임워크는 자기가 DOM의 유일한 주인이라고 가정한다. 그 가정 밖에 있는 것들이 있다. 브라우저 번역, 광고 차단기, 접근성 확장, 비밀번호 관리자. 전부 사용자가 켠 것이고 우리 코드에는 흔적이 없다.'],
      ['p','그리고 <strong>단독으로 재현되지 않는 버그가 있다</strong>는 것. 조건이 둘 이상이면 각각은 멀쩡하다. 재현 절차에 "어떤 상태로"가 빠져 있으면 "재현 불가"로 닫히고 다시 돌아온다.'],
      ['honest','여기서 잰 것과 안 잰 것|실제 번역 기능이 아니라 <b>번역기가 하는 DOM 조작</b>(텍스트 노드를 font로 감싸기)을 코드로 똑같이 했다. 실제 번역기는 속성 번역·노드 분할·비동기 적용까지 하는데 그 차이는 안 봤다. 리액트도 쓰지 않았다. 커밋 단계의 DOM 호출만 떼어냈으므로, 실제 재조정이 어떤 기준 노드를 고르는지는 버전에 따라 다를 수 있다. 광고 차단기나 비밀번호 관리자도 같은 계열일 것이라고 적었지만 <b>확인한 것은 번역 패턴 하나뿐</b>이다.']
    ],meta:'Chrome / macOS · 프레임워크 없이 DOM 호출만 · 조건이 같으면 결과도 같다(결정적) · 2026-09-15'},

  'write-skew':{grp:'데이터베이스',t:'보장 한도를 넘겨 지급됐는데 잘못 승인된 건이 없다',crumb:'PostgreSQL 16 · 격리 수준',tech:['PostgreSQL'],tags:['동시성','데이터 정합'],
    lede:'연간 보장 한도가 500만 원인 계약에 청구 두 건이 <strong>거의 동시에</strong> 들어왔다. 각각 300만 원. 두 건 모두 한도를 확인하고 승인됐고, 지급액은 600만 원이 됐다. 심사 로그를 뒤져도 <strong>잘못 승인된 건이 하나도 없다.</strong>',
    demo:true,
    body:[
      ['h2','남는 곳은 확인과 쓰기 사이의 틈뿐이다'],
      ['p','이런 장애는 원인 후보가 좁다. 청구 건 자체가 멀쩡하고 한도 검사 코드도 멀쩡하다면, 남는 곳은 확인과 쓰기 사이의 틈이다. 같은 모양이 자동이체 한도, 출금 한도, 포인트 소진에서도 그대로 나온다. 물어야 할 것은 셋이다.'],
      ['ul','왜 데이터베이스가 이 틈을 막아주지 않았나|막으려면 무엇을 바꿔야 하나(격리 수준인가, 락인가, 제약인가)|그 선택마다 무엇을 내주게 되나'],
      ['p','아래는 그 셋에 답하려고 <strong>같은 시나리오를 11가지 방법으로 돌려본 기록</strong>이다. 결론부터 말하면 흔히 말하는 처방 중 둘은 실제로는 막지 못했다.'],

      ['h2','가장 작게 재현한다'],
      ['p','청구 심사는 변수가 많으니 규칙 하나만 남긴 최소 형태로 줄인다. 교과서(<a href="https://dataintensive.net/" target="_blank" rel="noopener noreferrer">Kleppmann, <i>DDIA</i></a>)의 당직표 예제가 정확히 같은 구조라 그대로 썼다. 실제 실험 테이블도 이것이다. 규칙은 당직은 언제나 최소 한 명. alice와 bob이 함께 당직을 서던 중 거의 동시에 퇴근을 신청한다. 각자의 화면에는 당직이 두 명이라고 떠 있으니 둘 다 "나 하나쯤 빠져도 되겠다"고 판단한다. 잠시 후 당직은 아무도 없다.'],
      ['fig','skew'],
      ['demo','직접 인터리빙을 바꿔보기'],
      ['p','보장 한도와 대응시키면 이렇다. "당직 2명"이 "남은 한도 500만 원"이고, alice·bob 행을 각각 고치는 것이 청구 두 건을 각각 승인 처리하는 것이다. 대상 행이 다르다는 점이 핵심이라 한도 컬럼 하나를 같이 깎았다면 이야기가 달라진다. 뒤에서 다시 나온다.'],
      ['p','PostgreSQL 16에서 두 세션을 띄우고 위 순서대로 흘려보내면 <strong>REPEATABLE READ에서 당직이 0명이 된다.</strong> 겹침을 없애면 문제도 사라진다. 뒤 트랜잭션이 앞의 결과를 보고 판단하게 되기 때문이다.'],

      ['h2','왜 데이터베이스가 막지 못했나'],
      ['p','PostgreSQL의 REPEATABLE READ는 이름과 달리 <strong>스냅샷 격리</strong>다. 트랜잭션이 시작될 때 데이터베이스의 한 순간을 사진처럼 찍어두고, 그 트랜잭션은 끝까지 그 사진만 본다. 그래서 두 사람 모두 "당직 2명"이라는 같은 사진을 봤다.'],
      ['p','충돌 감지는 쓰기끼리 이뤄진다. 둘이 같은 행을 고치려 했다면 뒤늦은 쪽이 기다리다 막혔을 것이다. 그런데 T1은 alice 행을, T2는 bob 행을 고쳤다. 쓰는 대상이 겹치지 않으니 데이터베이스가 보기에는 아무 일도 없었다. 규칙이 깨지는 것은 두 결과가 합쳐진 뒤이고, 그때는 이미 둘 다 커밋된 후다.'],
      ['p','이 문제가 생기려면 조건이 둘이다. ① 각자 <b>읽은 것</b>을 근거로 판단하고 ② <b>서로 다른 행</b>에 쓴다. 둘 중 하나만 없어도 발생하지 않는다. 위 시뮬레이터에서 겹침을 없애보면 확인된다.'],

      ['h2','막을 방법을 전부 재봤다'],
      ['p','후보를 세 갈래로 나눴다. 격리 수준을 올리는 것, 읽을 때 잠그는 것, <strong>제약을 데이터베이스로 옮기는 것</strong>. 여기에 "앱이 쓰기 직전에 조건을 한 번 더 확인한다"는 흔한 방어책을 교차해 11가지를 만들었다. 전부 같은 인터리빙으로 돌렸다.'],
      ['tbl','방법|결과|판정;① REPEATABLE READ (기준선)|당직 0명|✗ 통과시킴;② SERIALIZABLE|당직 1명|✓ 커밋 거부 → 재시도;③ RR + SELECT FOR UPDATE|당직 1명|✓ 차단 → 재시도;④ READ COMMITTED + FOR UPDATE|당직 0명|✗ 통과시킴;⑤ RR + 제약 트리거(count)|당직 0명|✗ 통과시킴;⑥ SERIALIZABLE + 제약 트리거|당직 1명|✓ 차단 → 재시도;⑦ RR + 카운터 행 CHECK|당직 1명|✓ 차단 → 재시도;⑧ READ COMMITTED + 카운터 CHECK|당직 1명|✓ CHECK 위반으로 거부;⑨ RR + 쓰기 전 재확인|당직 0명|✗ 통과시킴;⑩ READ COMMITTED + 재확인|당직 0명|✗ 통과시킴;⑪ RC + FOR UPDATE + 재확인|당직 1명|✓ <b>재시도 불필요</b>'],
      ['p','3회 반복 실행에서 11행 모두 같은 결과가 나왔다. 앞선 레이스 실험처럼 확률적으로 흔들리는 종류가 아니라, 격리 수준과 락이 정하는 결정적 동작이다.'],

      ['h2','통념 두 개가 틀렸다'],
      ['p','"불변식은 DB 제약으로 옮기면 된다"(⑤). 못 막았다. 제약 트리거가 커밋 시점에 <code>count(*)</code>를 세는데, 그 <code>SELECT</code>도 자기 트랜잭션의 스냅샷에서 실행된다. T1이 셀 때는 bob이 아직 당직이고, T2가 셀 때는 alice가 아직 당직이다. 둘 다 "1명 남네" 하고 통과시킨다. 제약을 데이터베이스로 옮겨도 그 제약이 읽기를 하면 같은 함정에 빠진다.'],
      ['p','<strong>"쓰기 직전에 한 번 더 확인하면 된다"(⑨⑩)</strong>. 못 막았다. 재확인도 결국 읽기이고, 락이 없으면 그 읽기 역시 상대를 못 본다. 확인을 두 번 해도 확인과 쓰기 사이의 틈은 그대로다. 틈을 좁힌 것이지 없앤 것이 아니다.'],
      ['honest','④는 실험 설계가 만든 결과였다|READ COMMITTED + FOR UPDATE가 통과시킨 것(④)은 락이 무력해서가 아니다. 잠근 뒤 뒤 세션이 <b>최신 값 1명을 정확히 보는데도</b> 스크립트가 조건 검사 없이 무조건 UPDATE했기 때문이다. 조건 검사를 붙이자(⑪) 곧바로 막혔다. <b>락은 올바른 값을 보여줄 뿐, 판단은 앱이 한다.</b>'],

      ['h2','낙관적으로 막을까, 비관적으로 막을까'],
      ['p','막은 6가지는 성격이 둘로 갈린다. <strong>②③⑥⑦은 "일단 진행시키고 커밋 때 거부"</strong>하는 낙관적 방식이라 앱에 재시도 코드가 반드시 있어야 한다. 재시도를 안 짜두면 사용자에게 에러가 그대로 나간다.'],
      ['pre','ERROR:  could not serialize access due to read/write dependencies among transactions'],
      ['p','⑪은 읽는 순간 잠그고 최신 값으로 판단하므로 재시도가 필요 없다. 대신 뒤 세션이 앞 세션의 커밋까지 대기한다. 재시도 코드를 안 짜도 되는 값을 처리량으로 치르는 셈이다. 경합이 드물면 유리하고, 잦으면 대기가 쌓인다.'],
      ['p','⑧은 유일하게 데이터베이스가 스스로 막았다. 당직 수를 세는 대신 카운터 한 행을 <code>CHECK (n >= 1)</code>로 걸고 그 행을 같이 고치게 했다. 서로 다른 행을 고치던 것이 같은 행 경합으로 바뀌면서 원래의 쓰기 충돌 감지에 걸린다. 격리 수준을 올리지 않고 기본값 그대로 막힌다.'],
      ['note','고르는 기준|재시도 코드를 짤 수 있나 → ② 또는 ⑦. 경합이 드물고 코드를 단순하게 두고 싶나 → ⑪. 불변식이 오래 살아남을 규칙이고 앱이 여럿이나 → ⑧. 앱마다 규칙을 다시 구현하지 않아도 되는 것은 ⑧뿐이다.'],

      ['h2','치르는 비용과 남은 것'],
      ['p','맨 앞의 증상으로 돌아가면, 보장 한도 초과 지급도 자동이체 한도 초과도 포인트 이중 소진도 전부 ⑧이 다루는 모양이다. 규칙이 "합계가 얼마 이하"인 경우다. 그럴 때는 합계를 세지 말고 합계를 담은 행을 두고 그 행을 같이 고치면 된다. 다만 공짜는 아니다. 그 행이 병목이 된다. 당직을 바꾸는 모든 트랜잭션이 그 한 행을 거치므로 동시성이 그 행의 처리량으로 묶인다. 당직표처럼 변경이 드문 데이터면 괜찮고, 인기 상품 재고처럼 초당 수백 건이 몰리는 곳이면 이 한 행이 전체를 잡는다.'],
      ['p','⑪의 대기도 무한정은 아니다. 락을 잡은 트랜잭션이 길어지면 뒤가 모두 밀리고, 잠그는 순서가 엇갈리면 데드락이 된다. <strong>어느 쪽을 골라도 없어지는 비용은 없고 옮겨질 뿐이다.</strong>'],
      ['honest','재보지 않은 것|경합이 실제로 몰릴 때 ⑧의 카운터 행과 ⑪의 락 대기가 각각 처리량을 얼마나 깎는지는 재지 않았다. 이 실험은 두 세션을 손으로 인터리빙한 것이라 <b>정확성만 판정할 수 있고 처리량은 판정할 수 없다.</b> 부하를 걸어 재보는 것은 다음 과제로 남긴다.']
    ],meta:'PostgreSQL 16.15 · 두 세션을 FIFO로 인터리빙해 측정 · 11가지 방법 3회 반복, 전 행 동일 · 2026-09-14<br>당직 의사 시나리오는 <a href="https://dataintensive.net/" target="_blank" rel="noopener noreferrer">Martin Kleppmann, <i>Designing Data-Intensive Applications</i></a>의 write skew 예제를 따랐다. 측정치는 직접 실행한 값이다.'},
  'race':{grp:'Java',t:'CI는 초록불인데 운영에서만 숫자가 안 맞는다',crumb:'Java 17 · 동시성',tech:['Java'],tags:['동시성','재현 조건'],
    lede:'정산 배치 합계가 가끔 틀린다. <strong>로컬에서도 CI에서도 재현되지 않는다.</strong> 운영에서, 그것도 트래픽이 몰리는 시간대에만 나온다.',
    demo:'race',
    body:[
      ['h2','재현이 안 된다는 건 조건이 따로 있다는 뜻이다'],
      ['p','"재현이 안 된다"가 "버그가 없다"는 뜻이 아니라면, <strong>재현 조건이 따로 있다</strong>는 뜻이다. 물을 것은 셋이다.'],
      ['ul','무엇이 이 버그를 나타나게 하고 무엇이 숨기나|숨었을 때 테스트는 무엇을 증명하나|고치는 방법이 여럿이라면 어느 것을 고르나'],

      ['h2','한 줄이 세 동작이다'],
      ['p','<code>counter++</code>는 한 줄이지만 실제로는 <strong>값을 읽고, 1을 더하고, 다시 쓰는 세 동작</strong>이다. 두 스레드가 같은 값을 읽어버리면 각자 더한 뒤 같은 값을 쓰게 되고, 증가는 두 번 일어났는데 결과는 한 번만 오른다.'],
      ['fig','race'],
      ['p','8스레드가 각각 100만 번 올리게 하자 기대값 800만 중 662만이 사라졌다. 30번 돌려 30번 다 틀렸다. "가끔 한두 개 어긋나는" 수준이 아니다.'],

      ['h2','그런데 조건을 줄이면 버그가 사라진다'],
      ['p','스레드당 반복을 100만 회에서 1천 회로 줄이자 20번 중 한 번도 실패하지 않았다. 코드는 한 글자도 바뀌지 않았다.'],
      ['demo','반복 횟수를 직접 밀어보기'],
      ['p','작업이 너무 짧으면 JIT가 루프를 최적화해버려서, 스레드를 만드는 시간이 실제 작업 시간보다 길어진다. 결국 스레드들이 겹치지 못하고 차례대로 실행되는 셈이 된다. 슬라이더를 10만 회에 두면 20번 중 14번, 간헐적으로 실패하는 가장 위험한 구간이 나온다. CI에서 가끔 빨간불이 뜨고 재실행하면 통과하는 버그가 여기 산다.'],
      ['p','그래서 답은 분명하다. <strong>테스트가 초록불이라는 사실은 레이스가 없다는 증거가 되지 못한다.</strong> 개발 환경의 낮은 부하가 버그를 가리고 있었을 뿐이다.'],
      ['note','틈의 크기가 곧 위험의 크기다|한도를 확인하고 차감하기까지의 틈이 <b>0ns면 10번 중 0번</b> 실패했지만, 그 사이에 100µs짜리 I/O를 하나 끼워 넣자 <b>10번 중 10번</b> 초과 처리가 났다. 외부 호출이나 로깅이 끼어 있는 코드가 더 위험한 이유다.'],

      ['h2','고치는 방법마다 값이 다르다'],
      ['tbl','방법|정확한가|중앙값;int++ (무방비)|✗ 30/30 실패|7ms;volatile int++|✗ 10/10 실패|—;synchronized|✓|277ms;AtomicInteger|✓|392ms;ReentrantLock|✓|176ms;LongAdder|✓|7ms'],
      ['p','눈여겨볼 것은 <code>volatile</code>이 전혀 도움이 되지 않았다는 점이다. <code>volatile</code>은 "다른 스레드가 바꾼 값을 보이게" 할 뿐, 읽고-더하고-쓰는 과정을 하나로 묶어주지 않는다. 가시성과 원자성은 다른 문제인데 같은 것으로 오해되는 일이 잦다.'],
      ['p','반직관적인 결과는 <strong><code>AtomicInteger</code>가 <code>synchronized</code>보다 느렸다</strong>는 것이다. 경합이 심하면 CAS는 실패하고 재시도하기를 반복하는데, 그 재시도 비용이 차라리 기다리는 것보다 비싸진다. 같은 순서가 Rust에서도 재현됐으므로(Mutex 155ms &lt; Atomic 217ms) JVM의 특성이 아니라 더 일반적인 현상으로 보인다.'],

      ['h2','0회는 없다는 뜻이 아니었다'],
      ['p','같은 실험에서 명령어 재배열도 재봤다. 쓰는 쪽이 <code>data = 42</code> 다음 <code>ready = true</code> 를 하고, 읽는 쪽은 <code>ready</code> 를 기다렸다가 <code>data</code> 를 읽는다. 두 쓰기가 뒤집히면 읽는 쪽은 ready가 true인데 data가 0인 상태를 본다.'],
      ['p','3,000회를 돌렸는데 한 번도 못 봤다. 그래서 "이 기계의 메모리 모델이 강해서 관측하기 어렵다"고 적고 재현 실패로 남겼다. 그 기록이 틀렸다.'],
      ['p','세어본 것은 시도 횟수였다. <strong>실제로 겨룬 횟수를 따로 세어보니 3,000회 중 100회였다.</strong>'],
      ['tbl','하네스|시도|실제로 겨룬 라운드;라운드마다 새 스레드|3,000|<b>121 · 123 · 75</b>;스레드 재사용 + 배리어|200,000|<b>188,000 ~ 200,000</b>'],
      ['p','라운드마다 스레드를 새로 만들면 시작에 수십 마이크로초가 걸린다. 겨루는 구간은 나노초다. 읽는 쪽이 도착했을 때 쓰는 쪽은 이미 끝나 있다. 나머지 97%는 읽는 쪽이 <code>ready</code> 를 아예 못 보고 시간만 재다 끝났다. 하드웨어 탓을 했는데 실험이 성립하지 않고 있었다.'],

      ['h2','정렬하면 보인다'],
      ['p','스레드를 미리 띄워두고 라운드마다 배리어로 동시에 출발시켰다. 20만 라운드를 여덟 번 돌린 결과다.'],
      ['tbl','변형|겨룬 라운드|재배열 관측률|여덟 번 중 관측된 실행;평범한 필드|12,384 ~ 92,753|0 ~ 0.28%|<b>3 / 8</b>;두 쓰기를 256바이트 떼어놓음|187,640 ~ 199,999|0.01 ~ 0.10%|<b>8 / 8</b>;ready에 volatile|199,975 ~ 200,000|<b>0%</b>|<b>0 / 8</b>'],
      ['p','만 번에 한 번에서 천 번에 한 번 사이로 나온다. 명세가 허용한다고만 적었던 것이 실측된다.'],
      ['p','대조군이 깨끗하다. <strong>같은 하네스에서 volatile만 붙이면 누적 160만 라운드에서 0회다.</strong> 앞에서 volatile이 카운터 증가를 못 막는다고 했는데 그것도 맞다. volatile은 원자성을 주지 않고 순서를 준다. 두 결론이 어긋나 보였지만 서로 다른 것을 말하고 있었다.'],
      ['note','가설 하나는 세웠다가 기각했다|처음엔 "두 쓰기가 같은 캐시 라인에 있으면 같이 나가므로 안 뒤집힌다"고 봤다. 떼어놓은 쪽이 안정적으로 관측돼 맞는 줄 알았다. <b>그런데 평범한 필드에서도 나온다.</b> 게다가 그때의 관측률(0.16~0.28%)이 떼어놓은 쪽(0.01~0.10%)보다 높다. 겹치므로 캐시 라인이 재배열을 줄인다고 말할 수 없다. 실제 차이는 <b>겨룬 라운드가 네 배</b>라는 것이고, 왜 그런지는 확인하지 못했다.'],
      ['honest','여전히 재보지 않은 것|<b>x86에서는 재보지 않았다.</b> x86은 이 형태의 재배열을 허용하지 않으므로 관측되지 않을 것으로 보지만 장비가 없어 확인하지 못했다. <b>어느 층이 뒤집었는지도 가르지 않았다.</b> JIT인지 CPU인지 이 실험으로는 구별되지 않는다. <b>관측률의 분산이 크다.</b> 같은 조건에서 0.01%와 0.28%가 나오는데 코어 배치와 스케줄링 영향으로 보이나 고정하지 않았다. 그리고 이런 실험의 표준 도구를 쓰지 않고 직접 짰으므로 하네스 자체의 편향 가능성이 남는다.'],
      ['h2','읽는 쪽이 있느냐로 갈린다'],
      ['p','정확한 넷 중에서 고른다면 기준은 읽는 쪽이 있느냐다. 누적만 하고 중간값을 안 읽는다면 <code>LongAdder</code>가 압도적이다(7ms): 스레드별 칸에 나눠 담았다가 읽을 때 합치므로 경합 자체가 없다. 반대로 매번 정확한 현재값이 필요하면 합치는 비용이 붙으므로 이점이 사라진다.'],
      ['p','더 중요한 것은 그 위의 선택이다. <strong>동기화를 최적화하기 전에 공유를 없앨 수 있는지 본다.</strong> 스레드마다 따로 세고 마지막에 합치면 동기화가 0회다. <code>LongAdder</code>가 빠른 이유도 결국 그것을 안에서 하고 있기 때문이다.']
    ],meta:'Java 17 (Zulu) · 8스레드 · 각 방법 5회 중앙값 · 2026-09-11'},
  'ownership':{grp:'Rust',t:'같은 레이스를 빌드 단계에서 잡을 수 있나',crumb:'Rust 1.98 · 소유권',tech:['Rust','Java'],tags:['동시성'],
    lede:'앞 글에서 본 레이스는 <strong>운영에서만, 그것도 운이 나빠야</strong> 드러났다. 테스트로는 못 잡는다면 그 앞 단계: 컴파일에서 잡을 수는 없을까.',
    body:[
      ['h2','초록불이 증거가 못 된다면 무엇이 증거인가'],
      ['p','앞 실험의 결론은 불편했다. <strong>테스트 초록불이 레이스가 없다는 증거가 못 된다</strong>면, 무엇이 증거가 되나. 물을 것은 셋이다.'],
      ['ul','실행하지 않고 이 버그를 판정할 수 있나|가능하다면 무엇을 대가로 치르나|그렇게 고친 코드의 성능은 어떤가'],
      ['p','Java에서 662만 건이 사라지던 그 코드를 Rust로 그대로 옮겨 적어 확인했다.'],

      ['h2','실행해볼 기회가 주어지지 않는다'],
      ['pre','error[E0499]: cannot borrow `counter` as mutable more than once at a time\n  --> race_attempt.rs:19:31\n   |\n19 |  let h = thread::spawn(|| {\n   |          `counter` was mutably borrowed here in the previous iteration of the loop'],
      ['fig','rust'],
      ['p','데이터 레이스의 정의는 <strong>"여러 실행 흐름이 같은 데이터에 동시에 접근하고, 그중 최소 하나가 쓰기"</strong>다. Rust의 빌림 규칙은 "가변 접근은 동시에 하나만"이다. 두 문장은 사실상 같은 말이고, 그래서 데이터 레이스는 타입 시스템 단계에서 걸러진다. 동시성을 위한 특별한 검사가 아니라 일반 규칙의 한 경우다.'],
      ['p','Java의 <code>int counter</code>에는 "공유된다"와 "변경된다"는 두 성질이 암묵적으로 섞여 있었다. Rust는 이를 <code>Arc</code>(공유)와 <code>Mutex</code>(변경)로 쪼개서 명시하게 만든다. 무엇을 공유하고 무엇을 잠그는지 코드에 적어야만 컴파일된다.'],

      ['h2','치르는 대가'],
      ['p','공짜가 아니다. 컴파일러를 통과시키려면 설계를 먼저 정해야 한다. Java에서는 일단 돌려보고 나중에 <code>synchronized</code>를 붙일 수 있지만, Rust에서는 그 결정을 미룰 수 없다. 빠르게 프로토타이핑하는 국면에서는 이것이 분명한 마찰이다.'],
      ['p','그리고 <strong>모든 동시성 버그를 막아주지는 않는다.</strong> 데드락과 경합으로 인한 성능 저하는 그대로 남는다. 막아주는 것은 "데이터 레이스"라는 한 종류뿐이고, 그 대신 그것만은 확실하다.'],

      ['h2','고친 뒤에 다시 드러난 것'],
      ['tbl','방법|시간|유실;Mutex[[lt]]u64[[gt]]|155.7ms|0;AtomicU64|217.8ms|0;스레드별 집계 후 합산|0.1ms|0'],
      ['p','여기서 Java에서 봤던 순서가 <strong>그대로 반복됐다.</strong> Atomic이 Mutex보다 느리다. 한 언어에서만 봤다면 그 런타임의 특성으로 넘겼을 텐데, 두 언어에서 같은 순서가 나오자 이것이 경합 자체의 성질이라는 쪽으로 해석이 바뀐다. 언어를 바꿔 같은 실험을 돌리는 것의 값이 여기 있다.'],
      ['note','가장 빠른 쪽은 경합을 없앤 쪽|스레드마다 자기 변수에 세고 마지막에 한 번 합치면 동기화가 0회다. Java의 <code>LongAdder</code>(7ms)와 같은 발상이다. <b>동기화를 최적화하기 전에 동기화가 필요한지를 먼저 묻는</b> 게 낫다. 이 결론은 언어와 무관했다.'],

      ['h2','스택을 바꾸자는 얘기가 아니다'],
      ['p','업무 스택을 바꾸자는 얘기가 아니다. 가져갈 것은 질문 하나다. "이 데이터는 공유되나, 변경되나, 둘 다인가." Rust는 그걸 안 적으면 컴파일을 안 해주고, Java·Kotlin·TypeScript는 안 적어도 돌아간다. <strong>돌아가는 쪽에서 그 질문을 스스로 하게 되는 것</strong>이 이 실험의 실제 소득이다.'],
      ['honest','재보지 않은 것|<code>Rc</code>/<code>RefCell</code>처럼 빌림 검사를 <b>런타임으로 미루는</b> 경우는 다루지 않았다. 그 경로를 쓰면 같은 규칙이 패닉으로 강제되는데, 그러면 다시 "돌려봐야 안다"는 자리로 돌아온다. 어디까지가 컴파일 타임 보장인지의 경계는 아직 안 그어봤다.']
    ],meta:'rustc 1.98.1 · 8스레드 × 100만 회 · cargo 없이 rustc 단독 · 2026-09-11'},
  'oom':{grp:'Java',t:'힙을 늘렸는데 또 OOM으로 죽는다',crumb:'Java 17 · JVM 메모리',tech:['Java'],tags:['진단'],
    lede:'배치 서버가 며칠에 한 번씩 <code>OutOfMemoryError</code>로 재기동된다. 힙을 두 배로 늘렸더니 <strong>주기만 길어지고 또 죽었다.</strong> 늘려서 될 문제가 아니라는 뜻이다.',
    body:[
      ['h2','힙을 늘려도 안 되면 총량이 원인이 아니다'],
      ['p','힙을 늘려서 해결되지 않는다면 <strong>총량이 원인이 아니다.</strong> 그렇다면 물을 것은 셋이다.'],
      ['ul','가비지 컬렉터는 무엇을 기준으로 지우나. 오래된 것인가, 큰 것인가|왜 어떤 객체는 끝내 안 지워지나|죽은 뒤에 원인을 찾으려면 무엇이 미리 준비돼 있어야 하나'],

      ['h2','같은 일을 하는 두 프로그램'],
      ['p','1MB짜리 배열을 반복해서 만드는 프로그램을 두 벌 썼다. 차이는 단 하나. 한쪽은 만든 배열을 <code>static</code> 리스트에 넣어두고, 다른 쪽은 그냥 버린다.'],
      ['fig','oom'],
      ['p','붙들어둔 쪽은 힙 32MB에서 <strong>14MB만 쓰고 <code>OutOfMemoryError</code>로 죽었다.</strong> 버린 쪽은 힙 64MB로 500MB를 할당하고도 멀쩡히 끝났다. 총 할당량은 35배 차이인데 죽은 쪽이 적게 쓴 쪽이다.'],
      ['tbl','구분|붙들어둔 쪽|버린 쪽;힙 크기|32MB|64MB;흘려보낸 양|<b>14MB 에서 죽음</b>|<b>500MB 통과</b>;GC Pause Young|-|38회 (매번 27MB → 1MB);차이|static 리스트가 붙들고 있음|참조를 끊음'],

      ['h2','지우는 기준은 도달 가능성이다'],
      ['p','가비지 컬렉터는 "오래된 것"이나 "큰 것"을 지우지 않는다. <strong>GC Root에서 출발해 참조를 따라갔을 때 닿지 않는 것</strong>을 지운다. <code>static</code> 필드는 그 출발점 중 하나이므로, 거기 매달린 객체는 영원히 살아남는다.'],
      ['p','그래서 누수는 "메모리를 많이 썼다"가 아니라 "지워져야 할 것에 화살표가 남아 있다"는 상태다. 화살표가 하나라도 남아 있으면 크기와 무관하게 안 지워지고, 없으면 500MB를 흘려보내도 아무 일도 없다.'],
      ['note','힙 크기가 곧 쓸 수 있는 크기는 아니다|32MB로 띄웠는데 14MB에서 터졌다. 힙은 Eden·Survivor·Old 같은 영역으로 나뉘어 있고, GC가 살아남은 객체를 다른 영역으로 <b>복사하려면 그만큼의 여유</b>가 필요하기 때문이다. "힙 절반쯤 썼는데 왜 죽지"의 답이 여기 있다.'],

      ['h2','로그가 그 과정을 보여준다'],
      ['p','500MB를 흘려보낸 쪽의 GC 로그에는 <code>Pause Young</code>이 38번 찍혔고 매번 27MB가 1MB로 줄었다. 회수가 계속 되고 있었다는 뜻이다. 반대쪽 로그에는 이 회수가 없다. 지울 수 있는 게 없으니 GC가 돌아도 아무것도 안 줄어든다.'],
      ['p','또 하나 눈에 띈 것은 <code>G1 Humongous Allocation</code>이다. 1MB 배열이 G1의 리전 절반을 넘는 <strong>큰 객체로 분류되어 일반 객체와 다른 경로</strong>를 탄다는 표시다. 큰 배열이나 큰 문자열을 남발하면 이 경로가 병목이 된다.'],

      ['h2','장애가 났을 때 밟는 순서'],
      ['p','순서는 이렇다. ① 힙 덤프를 확보한다. 단 <code>-XX:+HeapDumpOnOutOfMemoryError</code>는 죽기 전에 미리 켜져 있어야 한다. 없이 재기동하면 원인을 추적할 방법이 사라진다. 실험에서는 17MB짜리 덤프가 실제로 생성되는 것까지 확인했다. ② 덤프를 열어 무엇이 GC Root에서 도달 가능한 채로 쌓여 있는지만 본다. ③ 그 다음에 힙 크기를 고민한다.'],
      ['p','현실에서 이 자리를 차지하는 단골은 셋이다. 정리되지 않는 <code>static</code> 캐시, 해제하지 않은 리스너, 그리고 <strong>스레드풀에서 살아남는 <code>ThreadLocal</code></strong>. 셋 다 "요청이 끝나면 사라질 것"이라고 가정했는데 실제로는 애플리케이션 수명만큼 사는 것들이다.'],
      ['honest','재보지 않은 것|누수 없이도 일어나는 OOM: 순간적으로 큰 결과 집합을 메모리에 올리는 경우: 은 다루지 않았다. 이 실험은 <b>도달 가능성이 원인인 경우</b>만 재현했다. 힙 덤프에서 지배 트리(dominator tree)를 실제로 읽어 범인을 특정하는 절차도 도구 없이 확인만 하고 넘어갔다.']
    ],meta:'Java 17 (Zulu) · -Xmx32m / -Xmx64m · G1GC · javac 단독 빌드 · 2026-09-11'},
  'self-invocation':{grp:'Java',t:'예외가 났는데 데이터가 절반만 남았다',crumb:'Java 17 · 프록시·트랜잭션',tech:['Java'],tags:['데이터 정합'],
    lede:'처리 도중 예외가 났으니 전부 롤백됐어야 하는데 <strong>2건이 그대로 남아 있다.</strong> 코드를 열어보면 <code>@Transactional</code>은 분명히 붙어 있다.',
    body:[
      ['h2','애노테이션은 누가 언제 읽나'],
      ['p','애노테이션이 붙어 있는데 동작하지 않는다면, 그 애노테이션을 누가 언제 읽는지를 모르고 있는 것이다. 물을 것은 셋이다.'],
      ['ul','<code>@Transactional</code>은 무엇이 읽어서 무엇을 하나|그것이 작동하지 않는 조건은 무엇인가|같은 함정을 구조적으로 피하려면 어떻게 짜야 하나'],
      ['p','Spring을 설치할 수 없는 환경이라 <strong>DI 컨테이너와 AOP 프록시를 직접 만들어</strong> 확인했다. 평소 "주의하라"고만 듣던 것의 이유가 만들고 나니 보였다.'],

      ['h2','프록시는 바깥에서 감싼다'],
      ['fig','proxy'],
      ['p','컨테이너는 원본 객체를 그대로 주지 않고 대리 객체로 감싸서 준다. 트랜잭션을 열고 닫는 코드는 그 대리 객체에 있다. 바깥에서 메서드를 부르면 대리 객체를 지나므로 트랜잭션이 열린다.'],
      ['p','여기서 함정이 따라 나온다. <strong>감싸는 일은 바깥에서 일어난다.</strong> 객체 내부에서 <code>this.otherMethod()</code>를 부르면 그 호출은 대리 객체를 거치지 않고 원본끼리 직접 이어진다. 애노테이션은 그대로 붙어 있지만 아무도 읽지 않는다.'],

      ['h2','로그가 아니라 데이터가 증명한다'],
      ['p','같은 메서드를 두 경로로 불러봤다.'],
      ['pre','[service] createUser(alice) 진입: tx활성=false\n  [repo] save(alice) → ⚠️ 트랜잭션 없음 → 즉시 AUTOCOMMIT'],
      ['p','프록시를 지난 호출은 예외가 나자 저장된 것이 0건으로 깨끗이 롤백됐다. 반면 <code>this</code>로 부른 쪽은 예외가 났는데도 alice와 bob 2건이 그대로 남았다. 트랜잭션이 없었으니 각 저장이 즉시 확정된 것이다.'],
      ['tbl','호출 경로|트랜잭션 BEGIN|예외 후 남은 데이터;프록시를 지남|있음|<b>0건</b>;this.메서드()|<b>없음</b>|<b>2건</b>;self.메서드()|있음|1건'],
      ['p','마지막 줄의 1건은 실패가 아니다. 호출마다 자기 트랜잭션을 여니 앞서 성공한 한 건은 남는 것이 맞다. 가운데 줄만 다르다. <strong>트랜잭션이 아예 열리지 않아</strong> 롤백할 대상도 없었다.'],
      ['p','이 차이가 중요한 이유는 그것이 <strong>로그 한 줄이 빠지는 문제가 아니라 데이터 정합성이 깨지는 문제</strong>로 나타나기 때문이다. 실패한 작업의 절반이 남아 있는 상태: 처리 중 오류가 났는데 일부만 반영된 청구 건, 취소했는데 남아 있는 차감이 이 모습이다. 에러 로그에는 "롤백했다"고 찍혀 있을 수도 있다.'],

      ['h2','고치는 방법과 그 대가'],
      ['p','자기 자신의 프록시를 주입받아 <code>self.method()</code>로 부르면 정상 동작한다. 실험에서도 그렇게 확인됐다. <strong>다만 이 방법은 "프록시가 있다"는 구현 사정이 코드에 드러난다.</strong> 읽는 사람은 왜 자기를 주입받는지 알 수 없고, 리팩터링하다 다시 <code>this</code>로 돌아가기 쉽다.'],
      ['p','그래서 판단은 트랜잭션 경계를 별도 객체로 분리하는 쪽으로 간다. 경계가 클래스 경계와 일치하면 내부 호출 자체가 생기지 않으므로, 함정을 피하는 게 아니라 함정이 생길 자리를 없애는 것이 된다.'],
      ['note','같은 모양의 다른 함정들|프록시를 지나야 동작하는 것은 트랜잭션만이 아니다. <code>@Cacheable</code>, <code>@Async</code>, <code>@Retryable</code>도 같은 구조라 내부 호출에서 똑같이 조용히 사라진다. <b>"애노테이션이 붙었는데 동작을 안 한다"</b>는 증상을 보면 호출 경로부터 의심하는 게 빠르다.'],
      ['honest','이것은 Spring이 아니다|JDK 동적 프록시와 리플렉션으로 <b>동작 원리만 재현</b>한 것이다. CGLIB 기반 프록시, 전파 옵션(<code>REQUIRES_NEW</code> 등), 빈 스코프와 생명주기는 구현하지 않았다. 순환 의존성은 생성자 주입에서는 기동 실패, 필드 주입에서는 통과하는 것까지만 확인했다. 실제 Spring의 동작이 이와 다른 지점이 있을 수 있다.']
    ],meta:'Java 17 (Zulu) · JDK 동적 프록시 + 리플렉션으로 미니 IoC/AOP 직접 구현 · 2026-09-11'},
  'nplus1':{grp:'Java',t:'목록 API가 DB를 스물한 번 호출하고 있었다',crumb:'JDBC · 데이터 접근',tech:['Java','PostgreSQL'],tags:['진단'],
    lede:'로컬에서는 8ms라 아무도 눈치채지 못했다. 운영에 올리자 같은 화면이 <strong>수백 ms</strong>가 됐다. 코드는 한 줄도 안 바뀌었고 데이터만 늘었다.',
    demo:'nplus1',
    body:[
      ['h2','데이터 양인가, 왕복 거리인가'],
      ['p','로컬과 운영에서 <strong>같은 코드가 다르게 느려진다면</strong> 차이는 데이터 양 아니면 왕복 거리다. 물을 것은 셋이다.'],
      ['ul','이 화면이 쿼리를 몇 번 보내고 있나. 느낌이 아니라 숫자로|그 횟수가 데이터가 늘면 어떻게 변하나|줄이는 방법마다 무엇을 얻고 잃나'],
      ['p','모든 SQL이 카운터를 통과하게 만들어 직접 셌다. 로컬에서는 21회도 8ms라 체감되지 않으므로, 시간이 아니라 횟수를 봐야 한다.'],

      ['h2','편한 코드가 만드는 쿼리'],
      ['p','팀 목록을 가져오고 각 팀의 멤버를 순회하며 꺼내는 코드는 읽기에 자연스럽다. 그런데 데이터베이스 입장에서는 팀을 가져오는 쿼리 1번에 팀 개수만큼의 멤버 쿼리가 따라붙는다. 팀이 20개면 21번이다.'],
      ['fig','nplus1'],
      ['demo','팀 수를 늘려보기'],
      ['p','부모를 10건, 50건, 100건, 200건으로 늘려가며 세어보면 쿼리는 11, 51, 101, 201로 정확히 따라 오른다. 조인으로 바꾼 쪽은 몇 건이든 언제나 1번이다. 이 비례 관계가 N+1이라는 이름의 전부다.'],
      ['p','로컬이 안전해 보이는 이유도 여기서 나온다. 도커 왕복이 0.1ms 수준이라 201번을 보내도 62.7ms다. <strong>왕복이 1ms인 운영 DB라면 같은 코드가 200ms를 네트워크에서만 쓴다.</strong> 코드가 아니라 거리가 바뀐 것이다.'],

      ['h2','줄이는 방법 셋을 재봤다'],
      ['tbl','전략|쿼리 수|시간|가져온 행;지연 로딩|21|8.1ms|200;조인 (fetch join)|1|1.1ms|200;IN절 배치|2|2.6ms|200'],
      ['p','조인은 왕복을 1번으로 줄이지만 부모 행이 자식 수만큼 중복되어 전송된다. 자식이 많으면 전송량이 커지고, 페이징과 함께 쓰면 행 수가 어긋난다. IN절 배치는 2번으로 늘어나는 대신 중복이 없어서, <strong>자식이 많은 경우에는 오히려 유리</strong>하다.'],
      ['honest','시간은 근거로 삼지 않았다|같은 코드를 반복 실행했을 때 Docker for Mac 환경에서 실행 시간이 <b>±40%까지 흔들렸다.</b> 반면 <b>쿼리 횟수는 세 번 모두 완전히 동일</b>했다. 그래서 이 글의 결론은 횟수에 근거하고 밀리초에는 두지 않는다.'],

      ['h2','측정이 틀렸던 이야기'],
      ['p','배치 insert를 비교할 때 처음에는 한 번씩만 재고 "1.6배 빨라졌다"고 적었다. 그런데 같은 코드를 다시 돌리자 914ms에서 19,071ms까지 스무 배 넘게 흔들렸다. 단발 측정이 의미가 없다는 뜻이었다.'],
      ['p','5회 실행 후 중앙값으로 다시 재자 숫자가 1.6배에서 5.6배로 바뀌었다. 처음 쓴 결론이 틀렸던 것이다. 더 들여다보니 개선의 원인도 예상과 달랐다. 커밋 횟수를 줄인 효과(5.6배)보다 네트워크 왕복을 줄인 효과(35.4배)가 훨씬 컸다.'],
      ['p','흔들림 자체도 정보였다. autocommit 방식은 실행 시간이 3.8배까지 벌어졌지만 배치 방식은 1.15배 안에 머물렀다. <strong>느린 방식은 느릴 뿐 아니라 예측하기도 어렵다.</strong>'],

      ['h2','쿼리 카운터를 먼저 붙인다'],
      ['p','ORM을 쓰든 안 쓰든 <strong>쿼리 카운터를 먼저 붙인다.</strong> "N+1이 있는 것 같다"는 의심은 검증할 수 없지만 "이 요청이 201번 보낸다"는 숫자는 검증된다. 그 다음 부모 건수를 늘려가며 횟수가 비례해서 오르는지 본다. 오르면 N+1이고, 안 오르면 다른 문제다.'],
      ['p','고를 때는 자식이 몇 개인지가 기준이다. 자식이 적으면 조인, 많거나 페이징이 필요하면 IN절 배치. 둘 다 안 맞으면 애초에 그 화면이 자식 데이터를 다 필요로 하는지 되묻는 게 빠르다.']
    ],meta:'PostgreSQL 16 + JDBC 42.7.4 · 쿼리 카운터 계측 · 배치는 5회 중앙값 · 2026-09-11'},
  'index':{grp:'데이터베이스',t:'인덱스를 만들었는데 쿼리가 그대로다',crumb:'PostgreSQL 16 · 실행 계획',tech:['PostgreSQL'],tags:['진단'],
    lede:'계약 조회가 느려서 인덱스를 붙였는데 <strong>실행 시간이 거의 그대로다.</strong> <code>EXPLAIN</code>을 봐도 인덱스를 타는 것처럼 보인다. 인덱스가 잘못된 걸까, 아니면 원래 이런 걸까.',
    demo:'index',
    body:[
      ['h2','인덱스를 타느냐로 물으면 답이 안 나온다'],
      ['p','"인덱스를 타느냐 마느냐"로 묻는 한 답이 안 나온다. 계약 상태처럼 값 종류가 적은 컬럼은 인덱스를 붙여도 효과가 없는 경우가 흔한데, 그 경계가 어디인지를 물어야 한다.'],
      ['ul','조건에 걸리는 행이 몇 %일 때까지 인덱스가 유리한가|그 전환점은 데이터가 정하나, 설정이 정하나|옵티마이저가 고른 계획을 믿어도 되나'],
      ['p','50만 행짜리 테이블을 만들고 조건 비율을 <strong>0.1%에서 50%까지</strong> 올려가며 실행 계획을 지켜봤다.'],

      ['h2','전환점이 하나가 아니었다'],
      ['p','처음 기대는 단순했다. 어느 지점에서 인덱스 스캔이 순차 스캔으로 바뀔 테고, 그 지점을 찾으면 된다. 그런데 50%에 도달해도 넘어가지 않았다.'],
      ['fig','index'],
      ['p','계획에는 계속 <code>Bitmap Heap Scan</code>이 찍혀 있었다. 인덱스로 필요한 행 위치를 모아 정렬한 다음 테이블을 훑는 방식으로, <strong>인덱스 스캔과 순차 스캔 사이에 있는 제3의 선택지</strong>다. "인덱스냐 풀스캔이냐"라는 이분법에 이 층이 빠져 있었던 것이다.'],
      ['demo','선택도를 밀어보기'],
      ['p','이 층을 강제로 끄고(<code>enable_bitmapscan = off</code>) 나서야 0.7%라는 전환점이 드러났다. 비용을 보면 이유가 그대로 보인다. Index Scan 비용이 0.6%에서 8935까지 올라 Seq Scan 계열의 9804를 따라잡고, 다음 칸에서 역전당한다.'],

      ['h2','전환점은 데이터가 아니라 설정이 만든다'],
      ['tbl','random_page_cost|전환점;4 (기본값)|0.7%;2|2.0%;1.1 / 1.0|전환 없음'],
      ['p','디스크 임의 접근 비용을 낮게 잡으면(SSD를 가정하면) 전환점 자체가 사라진다. 같은 데이터, 같은 쿼리인데 설정 한 줄로 계획이 달라진다. 그러니 "몇 %부터 인덱스가 안 듣는다"는 숫자를 외우는 것은 의미가 없다. <strong>내 환경에서 재봐야 하는 값</strong>이다.'],
      ['p','복합 인덱스의 후행 컬럼도 같은 이야기다. <code>(a, b)</code> 인덱스에서 b만으로 조회하면 흔히 "인덱스를 못 탄다"고 말하지만, 실제로는 <b>인덱스 715페이지를 전부 훑는다.</b> 버퍼 3 대 717, 비용 43 대 6630: 탄다고 다 같은 게 아니다. <code>EXPLAIN</code>에 인덱스 이름이 찍혔다는 것만으로 안심하면 이걸 놓친다.'],

      ['h2','옵티마이저도 틀린다'],
      ['p','전환점을 넘긴 뒤 계획을 강제로 되돌려 실제 시간을 재봤다. 선택도 0.8%에서 10% 사이에서, 옵티마이저가 고른 계획이 강제로 지정한 계획보다 최대 5.8배 느렸다. 조인에서는 격차가 15.6배까지 벌어졌다.'],
      ['p','옵티마이저의 전환점은 0.7%인데 <strong>실측 손익분기는 15% 부근</strong>이다. 자릿수에 가깝게 어긋난다. 그런데 간극이 있다는 것만으로는 무엇을 고쳐야 할지 정해지지 않는다.'],

      ['h2','cost 숫자를 손으로 다시 계산했다'],
      ['p','여기서 멈추면 "옵티마이저가 틀렸다"까지다. 그런데 왜 하필 거기서 틀렸는지는 답이 안 된다. 비용 값이 어떤 식에서 나오는지를 모르면 다른 설정에서의 전환점을 예측할 수 없고, 예측을 못 하면 그 식을 이해한 게 아니다. PostgreSQL 소스의 비용 함수를 파이썬으로 옮겨 맞춰봤다.'],
      ['tbl','조건|추정 행수|EXPLAIN|손으로 계산|오차;Seq Scan (전 구간)|500,000|12134.00|12134.00|<b>0.00%</b>;sel_key ≤ 1|496|1916.93|1916.93|<b>0.00%</b>;sel_key ≤ 9|4,400|12904.28|12904.28|<b>0.00%</b>;sel_key ≤ 50|24,984|24063.57|24063.57|<b>0.00%</b>;sel_key ≤ 500|251,108|28832.97|28832.97|<b>0.00%</b>'],
      ['p','11개 지점 전부 오차 0.00%다. 식을 제대로 옮겼다는 뜻이고, 이제 이 식으로 예측할 수 있다.'],
      ['p','순차 스캔 쪽은 단순하다. 페이지 수에 페이지 비용을 곱하고 행마다 CPU 비용을 더한다. 인덱스 쪽의 핵심은 <strong>테이블 접근 비용을 두 극단 사이에서 correlation의 제곱으로 보간</strong>한다는 것이다.'],
      ['pre','max_IO = 읽을 페이지 수 × random_page_cost          # 완전 무작위라고 보면\nmin_IO = random_page_cost + (페이지 수 − 1) × seq_page_cost  # 인덱스 순서 = 물리 순서라면\nheap   = max_IO + correlation² × (min_IO − max_IO)'],
      ['p','제곱이라는 게 중요하다. 이 컬럼의 correlation은 0.0095라 제곱하면 0.00009다. 보간이 사실상 일어나지 않고 전부 무작위 비용으로 계산된다. 물리 정렬된 컬럼만 큰 선택도에서도 인덱스를 타는 이유가 이 한 항이다.'],

      ['h2','틀린 건 통계가 아니라 환산이다'],
      ['p','옵티마이저가 틀리는 원인은 둘로 나뉜다. 행수를 잘못 추정했거나, 행수는 맞는데 비용으로 환산하는 식이 현실과 다르거나. 둘은 처방이 정반대다. 앞이면 통계를 더 모아야 하고, 뒤면 통계를 아무리 모아도 안 바뀐다. 추정 행수 대신 실제 행수를 넣어 전환점을 다시 구했다.'],
      ['tbl','모델에 넣은 값|행수|전환점;추정 행수|4,400|0.9%;실제 행수|4,500 (오차 −2.2%)|<b>0.8%</b>'],
      ['p','한 칸밖에 안 움직인다. 통계는 거의 정확했고, 전환점과 실측 손익분기 사이의 간극은 전부 환산 쪽에서 나온다. <strong>여기서 ANALYZE를 더 돌려봐야 소용없다는 게 정해진다.</strong> 원인을 둘로 나눠보지 않으면 이 판단을 못 하고, 대개 통계부터 의심하게 된다.'],

      ['h2','cost가 작은 쪽을 고른다는 말도 정확하지 않다'],
      ['p','모델이 다 맞는 줄 알았는데 한 설정에서 어긋났다. 파보니 옵티마이저 쪽이 예상과 달랐다.'],
      ['pre','sel_key ≤ 26    Index 12019.50    Seq 12134.00    → 고른 것은 Seq Scan\n                12134.00 / 12019.50 = 1.0095'],
      ['p','<strong>인덱스가 더 싼데 순차 스캔을 골랐다.</strong> 계획을 모으는 함수에 1%짜리 허용 오차가 있어서, 총비용이 그 안쪽이면 비긴 것으로 보고 다른 기준으로 가른다. 여기서는 시작 비용이고 순차 쪽이 0.00, 인덱스 쪽이 0.42라 순차가 이긴다.'],
      ['p','이 규칙을 모델에 넣자 전부 맞았다.'],
      ['tbl','random_page_cost|모델 예측|옵티마이저 실제;4.0|0.9%|<b>0.9%</b>;2.0|2.6%|<b>2.6%</b>;1.5|33.9%|<b>33.9%</b>;1.2|53.4%|50% 안쪽엔 없음;1.1|60.2%|50% 안쪽엔 없음'],
      ['p','아래 두 줄은 모델이 50%를 넘는 지점을 가리키니 "50% 안쪽엔 없다"와 어긋나지 않는다. 쓸어본 범위가 50%까지였을 뿐이다.'],

      ['h2','식을 뒤집으면 이 환경의 값이 나온다'],
      ['p','여기까지 오면 방향이 하나 더 생긴다. 실측 손익분기를 넣고 <strong>그걸 만드는 설정값을 되찾는 것</strong>이다. 이분탐색으로 풀면 한 값이 나온다.'],
      ['pre','random_page_cost = 1.80   →   모델 전환점 15.1%   ·   옵티마이저 실제 15.1%'],
      ['p','흔히 말하는 1.1이 아니라 이 환경의 측정에서 나온 1.80이다. 그 값이 실제로 더 나은 선택을 만드는지 재봤다. 강제 실행 5회 중앙값과 옵티마이저의 선택을 나란히 둔 것이다.'],
      ['tbl','선택도|Index|Seq|기본값 선택|1.80 선택;1.0%|<b>2.48 ms</b>|24.49 ms|Seq ✗|Index;2.0%|<b>3.83 ms</b>|24.35 ms|Seq ✗|Index;5.0%|<b>8.24 ms</b>|22.36 ms|Seq ✗|Index;10.0%|<b>14.17 ms</b>|22.24 ms|Seq ✗|Index;15.0%|<b>21.61 ms</b>|22.93 ms|Seq ✗|Index;20.0%|28.88 ms|<b>24.68 ms</b>|Seq|Seq;30.0%|41.75 ms|<b>26.22 ms</b>|Seq|Seq'],
      ['p','빗나간 횟수는 기본값이 7개 중 5개, 역산한 값이 0개다. "random_page_cost를 내려라"는 조언은 흔한데, 얼마로 내릴지는 이렇게 구할 수 있다.'],
      ['honest','이 숫자를 가져다 쓰면 안 된다|1.80 은 이 테이블(46MB, 캐시에 전부 들어감), 이 correlation(0.0095), 이 디스크에서 나온 값이다. 가져갈 것은 숫자가 아니라 <b>재는 절차</b>다. 테이블이 캐시에 안 들어가면 무작위 읽기가 진짜로 비싸지므로 값이 올라간다. 그리고 이 실험은 병렬 스캔을 끈 상태다. 순차 스캔이 여러 워커로 갈라지면 비교 대상이 단일 스캔 둘이 아니게 돼서, 앞 절의 0.7%와 여기 0.9%가 한 칸 다르다.'],

      ['h2','인덱스를 만들었는데 안 빨라졌다면'],
      ['p','인덱스를 만들고 안 빨라졌다면 순서는 이렇다. ① <code>EXPLAIN (ANALYZE, BUFFERS)</code>로 추정 행수와 실제 행수를 나란히 본다. 둘이 크게 벌어져 있으면 통계 문제다. ② 계획 이름이 아니라 <strong>버퍼 수</strong>를 본다. 인덱스를 탔다고 적혀 있어도 715페이지를 훑고 있을 수 있다. ③ 선택도를 재본다. 조건에 걸리는 비율이 높으면 인덱스가 답이 아니라 쿼리나 모델링이 답이다.'],
      ['p','설정을 만지는 것은 마지막이다. <code>random_page_cost</code>는 전역이라 한 쿼리를 위해 바꾸면 다른 쿼리의 계획이 같이 흔들린다.'],

      ['h2','벤치마크가 자기 자신을 속인 이야기'],
      ['honest','하마터면 정반대 결론을 쓸 뻔했다|계획을 강제하려고 <code>enable_nestloop=off</code>를 켰더니 비용이 1e10으로 부풀어 <b>JIT 컴파일 임계값을 넘었다.</b> 컴파일에만 54.7ms가 붙어 0.23ms짜리 쿼리가 64.9ms로 보였고, "옵티마이저가 227배 옳았다"고 적을 뻔했다. 이후 모든 측정에 <code>jit=off</code>를 고정했다. <b>측정 도구가 측정 대상을 바꾸는 경우가 있다.</b>'],
      ['honest','재보지 않은 것|쓰기 비용은 재지 않았다. 인덱스는 읽기를 빠르게 하는 대신 <code>INSERT</code>·<code>UPDATE</code>마다 갱신 비용을 물리는데, 이 실험은 조회만 다뤘다. "인덱스를 몇 개까지 다는 게 이득인가"는 여기서 답할 수 없다.']
    ],meta:'PostgreSQL 16.15 · 50만 행 · jit=off 고정 · 비용 모델 재현은 병렬 스캔 off · 2026-09-11 / 2026-09-15'},
  'wal':{grp:'데이터베이스',t:'커밋 응답을 받았는데 서버가 죽으면',crumb:'PostgreSQL 16 · WAL',tech:['PostgreSQL'],tags:['데이터 정합'],
    lede:'배포 중에 DB 컨테이너가 내려갔다. 직전에 <strong>접수 완료 응답을 받은 청구 건</strong>은 살아 있을까. 그리고 그 보장은 공짜인가.',
    body:[
      ['h2','커밋이 끝났다는 말이 약속하는 것'],
      ['p','"커밋했으면 안전하다"는 말은 자주 듣지만, 그 말이 정확히 무엇을 약속하는지는 잘 안 따진다. 확인할 것은 셋이다.'],
      ['ul','커밋 성공 응답은 데이터가 어디까지 갔다는 뜻인가|프로세스를 강제로 죽여도 정말 지켜지나|그 보장을 끄면 얼마나 빨라지고 무엇을 잃나'],

      ['h2','먼저 쓰고 나중에 반영한다'],
      ['p','커밋이 끝났다는 말은 <strong>데이터 파일에 값이 기록됐다는 뜻이 아니다.</strong> 변경 내역이 로그에 안전하게 적혔다는 뜻이다. 데이터 파일 반영은 나중에 한가할 때 이뤄진다. 이 순서를 지키는 것이 write-ahead logging이고, 덕분에 그 사이에 죽어도 잃는 것이 없다.'],
      ['fig','wal'],

      ['h2','정말 그런지 죽여본다'],
      ['p','커밋 직후의 <code>redo_lsn</code>을 기록해두고 컨테이너를 강제 종료했다. <code>docker stop</code>은 정상 종료 절차를 밟으므로 <code>kill</code>을 써야 한다.'],
      ['pre','$ docker kill study-pg          # exit 137\n$ docker start study-pg\nLOG:  database system was not properly shut down; automatic recovery in progress\nLOG:  redo starts at 0/1A2B3C8'],
      ['p','<strong>크래시 직전에 기록해둔 지점과 재기동 로그의 시작 지점이 한 글자도 다르지 않았다.</strong> 데이터베이스는 그 지점부터 로그를 다시 읽어 커밋된 변경만 복원한다. 확인해보니 커밋한 행은 모두 살아 있었고, 커밋하지 않은 행은 사라져 있었으며, 다른 실험이 쓰던 테이블 21개도 온전했다.'],

      ['h2','그 보장에 얼마를 내고 있나'],
      ['p','안전을 만드는 것은 로그를 디스크에 밀어넣는 <code>fsync</code>다. 그걸 끄면(<code>synchronous_commit=off</code>) 얼마나 빨라지는지 재봤다.'],
      ['tbl','동시 세션|synchronous_commit=on|off|차이;1|238.7 tps|1,462.1 tps|6.1배;8|780.1 tps|24,485.1 tps|31.4배'],
      ['p','반직관적인 것은 <strong>동시성이 높을수록 이득이 커진다</strong>는 점이다. 보통은 여러 커밋을 묶어 한 번에 처리(group commit)하므로 부하가 높을수록 <code>fsync</code>의 상대적 손해가 줄 것 같은데, 실제로는 반대였다. 묶어서도 뚫지 못하는 천장이기 때문이다. 세션이 8개면 그 천장에 8배로 부딪힌다.'],

      ['h2','그래서 언제 끄나'],
      ['p','끄면 잃는 것은 마지막 몇 밀리초 사이의 커밋이다. 테이블이 깨지거나 반쯤 쓰인 행이 남는 것이 아니라, 응답은 받았는데 기록은 안 된 건이 생긴다. 그래서 판단 기준은 "데이터가 중요한가"가 아니라 <strong>"응답을 받은 건이 사라져도 복구 경로가 있는가"</strong>다.'],
      ['p','접속 로그, 화면 이벤트, 배치로 다시 만들 수 있는 집계처럼 원본이 다른 곳에 있는 데이터는 꺼도 된다. 청구 접수나 보험료 출금처럼 응답이 곧 약속인 데이터는 켜둔다. 전역 설정 대신 트랜잭션 단위로 <code>SET LOCAL synchronous_commit = off</code>를 쓰면 섞어 쓸 수 있다.'],
      ['honest','재현하지 못한 것|<code>synchronous_commit=off</code>에서 데이터가 실제로 유실되는 장면은 <b>만들어내지 못했다.</b> <code>docker kill</code>은 postgres 프로세스만 죽일 뿐 OS 페이지 캐시는 살아남아서, 커널이 나중에 디스크로 내려보내 준 것이다. 진짜로 재현하려면 전원을 끊거나 VM을 강제 종료해야 한다. 대신 아직 디스크에 닿지 않은 로그의 양(<code>insert_lsn - flush_lsn</code>)을 재어 <b>위험 구간을 수치로</b> 남겼다.']
    ],meta:'PostgreSQL 16.15 · docker kill로 크래시 유발 · pgbench 측정 · 2026-09-11'},
  'tuning':{grp:'데이터베이스',t:'계약 목록이 뒤 페이지로 갈수록 느려진다',crumb:'PostgreSQL 16 · 튜닝',tech:['PostgreSQL'],tags:['진단'],
    lede:'첫 페이지는 빠른데 뒤로 갈수록 느려진다. 데이터가 늘면서 <strong>같은 화면이 작년보다 느려졌다</strong>는 제보도 같이 들어온다. 인덱스는 이미 있다.',
    body:[
      ['h2','느리다는 말 하나에 원인은 다섯이었다'],
      ['p','"느리다"는 증상 하나에 원인은 여럿이다. 먼저 원인을 좁히지 않으면 인덱스만 늘어난다. 물을 것은 셋이다.'],
      ['ul','이 느림이 어느 유형인가: 인덱스를 못 타나, 타는데도 많이 읽나, 읽고 나서 버리나|고치면 얼마나 줄어드나(먼저 고칠 것을 정하려면 크기를 알아야 한다)|고친 쿼리가 <strong>원본과 같은 답</strong>을 내나'],
      ['p','흔한 원인 다섯 가지를 일부러 재현해 각각 고치고, 전후를 <code>EXPLAIN (ANALYZE, BUFFERS)</code>로 대조했다.'],

      ['h2','다섯 가지를 재현하고 각각 고쳤다'],
      ['tbl','무엇이 문제였나|before|after|개선;컬럼에 함수를 씌워 인덱스 무력화|2.578ms|0.058ms|44.4배;OR 조건|21.386ms|4.072ms|5.3배;상관 서브쿼리|329.909ms|45.241ms|7.3배;결과 정렬|34.688ms|0.133ms|260.8배;깊은 OFFSET 페이징|107.532ms|0.140ms|768.1배'],
      ['p','절대 시간보다 <strong>배수의 분포</strong>를 보는 게 낫다. 5.3배짜리와 768배짜리가 같은 "느린 쿼리"로 티켓에 올라오는데, 손대는 순서는 당연히 달라야 한다.'],

      ['h2','가장 크게 터진 것은 페이징이었다'],
      ['p','<code>LIMIT 10 OFFSET 100000</code>은 <strong>10만 10건을 읽어서 앞의 10만 건을 버린다.</strong> 페이지가 깊어질수록 버리는 양이 늘어나므로, 뒤로 갈수록 느려지는 목록은 대개 이 구조다. 처음 증상, "첫 페이지는 빠른데 뒤가 느리다": 이 그대로 설명된다.'],
      ['p','마지막으로 본 값을 기준으로 <code>WHERE id &gt; ?</code>를 거는 keyset 방식으로 바꾸면 필요한 만큼만 읽는다. 107.5ms가 0.14ms가 됐다.'],
      ['p','정렬을 없앤 사례(261배)도 성격이 같다. 정렬 조건과 같은 순서의 복합 인덱스를 만들어두면 데이터베이스가 이미 정렬된 상태로 읽어오므로 정렬 단계 자체가 계획에서 사라진다. 34.688ms가 0.133ms가 된 것은 일을 빨리 한 게 아니라 일을 안 하게 된 것이다.'],
      ['note','큰 개선은 대개 "안 하게 만든 것"이다|768배와 261배는 알고리즘을 개선한 게 아니라 <b>읽고 버리던 것을 안 읽게</b> 만든 결과다. 반면 5.3배와 7.3배는 같은 일을 더 효율적으로 한 것이다. 앞쪽은 구조를 바꿔야 나오고 뒤쪽은 인덱스로 나온다. <b>기대치가 다르므로 어느 쪽인지 먼저 판단</b>해야 한다.'],

      ['h2','그래서 어디부터 보나'],
      ['p','순서는 이렇다. ① <code>EXPLAIN (ANALYZE, BUFFERS)</code>에서 읽은 버퍼 수를 본다. 반환 행수에 비해 버퍼가 크게 많으면 "읽고 버리는" 유형이고, 그러면 인덱스가 아니라 쿼리 구조를 봐야 한다. ② 계획에 <code>Sort</code>나 큰 <code>Rows Removed by Filter</code>가 있는지 본다. 있으면 없앨 수 있는지부터 본다. ③ 그 다음에 인덱스를 고민한다.'],
      ['p','페이징이 특히 흔한 이유는 <strong>처음엔 안 느리기 때문</strong>이다. 데이터가 적을 때 쓴 <code>OFFSET</code> 코드가 몇 년 뒤에 장애가 된다. 목록 API를 새로 만든다면 처음부터 keyset으로 여는 편이 낫다.'],

      ['h2','빨라졌는데 답이 다르면 튜닝이 아니다'],
      ['note','다섯 사례 모두 결과를 대조했다|개선 전후 결과 집합의 <b>md5 해시가 일치하는지</b> 매번 확인했다. 특히 OR을 UNION으로 바꾸거나 서브쿼리를 조인으로 펴는 변형은 <b>중복 행이 생기거나 사라지기 쉬워서</b>, 이 확인이 없으면 성능 개선과 버그를 구분할 수 없다.'],
      ['honest','재보지 않은 것|여기 수치는 <b>한 번씩 잰 값</b>이고 Docker 환경이라 재실행하면 ±20%까지 흔들린다. 배수의 크기 순서(768 &gt; 261 &gt; 44 &gt; 7 &gt; 5)는 반복해도 유지됐지만 개별 ms는 근거로 삼지 않는다. 또한 keyset 페이징은 <b>임의 페이지로 점프할 수 없다</b>는 제약이 있는데, 그 제약이 실제 화면 요구사항과 충돌하는지는 이 실험에서 다루지 않았다.']
    ],meta:'PostgreSQL 16.15 · EXPLAIN (ANALYZE, BUFFERS) · 결과 집합 md5 대조 · 2026-09-11'},
  'gate':{grp:'도구',t:'로컬에서 통과했는데 CI에서 떨어진다',crumb:'shell · pre-push 게이트',tech:['Shell','Git'],tags:['경계 설계'],
    lede:'push하고 나서야 CI가 빨간불이다. 로컬에서는 분명히 통과했다. <strong>양쪽이 서로 다른 검사를 돌고 있기 때문</strong>인데, 그 사실을 알아차리는 데는 매번 왕복 한 번이 든다.',
    body:[
      ['h2','규칙이 두 곳에 적혀 있으면 반드시 어긋난다'],
      ['p','로컬과 CI가 어긋나는 것은 의지 문제가 아니라 <strong>구조 문제</strong>다. 규칙이 두 곳에 적혀 있으면 언젠가 반드시 벌어진다. 물을 것은 셋이다.'],
      ['ul','한 벌의 규칙을 양쪽이 함께 쓰게 하려면 어떻게 두나|의존성을 늘리지 않고 할 수 있나|그렇게 만든 게 정말 막는지는 어떻게 확인하나'],

      ['h2','검증 규칙을 두 곳에 쓰지 않는다'],
      ['fig','gate'],
      ['p','로컬 훅과 CI가 각자 명령을 나열하면 둘은 반드시 어긋난다. 한쪽에 규칙을 추가하고 다른 쪽을 잊는 일이 반복되기 때문이다. 그래서 검증 로직을 <code>ci-checks.sh</code> <strong>한 파일에 두고, 훅과 워크플로는 그 파일을 부르기만</strong> 하게 만들었다.'],
      ['p','문서 위주 저장소라 husky를 쓰자고 <code>node_modules</code>를 들일 이유가 없었다. git의 <code>core.hooksPath</code>를 쓰면 훅 자체를 저장소에 넣어 버전 관리할 수 있고, 결과적으로 외부 의존성 없이 같은 효과를 얻는다. 팀원이 늘어도 <code>git config core.hooksPath .githooks</code> 한 줄이면 끝이다.'],

      ['h2','무엇을 막는가'],
      ['p','네 단계를 통과해야 push가 진행된다. 추적되고 있는 <code>.env</code>나 소스에 박힌 토큰 패턴을 찾는 시크릿 검사, 로컬 전용 폴더가 실수로 커밋되지 않았는지 보는 유출 검사, 5MB가 넘는 파일을 걸러내는 용량 검사, 그리고 변경된 프로젝트만 골라 타입과 린트를 돌리는 검사다.'],
      ['p','마지막 단계가 <strong>"변경된 프로젝트만"</strong>인 것이 중요하다. 전부 도는 게이트는 느려지고, 느린 게이트는 결국 <code>--no-verify</code>로 우회된다. 우회되는 게이트는 없는 것과 같다.'],

      ['h2','정말 막는지 확인한다'],
      ['note','게이트는 실패 시나리오로 시험해야 한다|통과하는 것만 확인하면 <b>"아무것도 막지 않는 게이트"</b>를 못 잡아낸다. 일부러 금지된 파일을 스테이징해 <b>종료 코드 1로 실제 차단되는지</b>까지 확인했다. 검사는 했는데 통과도 시키는 형태가 가장 나쁘다. 있다고 믿게 만들기 때문이다.'],
      ['p','임시 저장소를 만들어 위반을 하나씩 심고 종료 코드를 봤다.'],
      ['tbl','심은 것|검사|결과;(없음)|전체|통과;추적 중인 <code>.env</code>|시크릿|<b>차단</b>;로컬 전용 <code>_private/</code>|유출|<b>차단</b>;6MB 파일|용량|<b>차단</b>'],
      ['p','여기까지는 기대대로다. 그런데 토큰 패턴을 <strong>어느 확장자에 넣느냐</strong>로 갈렸다.'],
      ['tbl','토큰을 넣은 파일|결과;.ts · .js · .json · .sh|<b>차단</b>;.py · .java · .sql · .md · .txt|<b>통과</b>'],
      ['p','시크릿 스캔이 훑는 확장자 목록에 앞의 넷만 들어 있었다. 세어보니 <strong>이 저장소의 .py · .java · .sql · .md 파일 357개가 검사 밖</strong>에 있었다. 막는 것이 일인 코드인데 정작 이 저장소가 가진 파일의 절반을 안 보고 있었다.'],
      ['p','통과 경로만 확인했으면 못 찾았을 구멍이다. 이 글이 말하는 원칙을 정작 이 게이트에 제대로 적용하지 않고 있었던 셈이다.'],

      ['h2','목록은 언제나 늦는다'],
      ['p','고치는 방향이 둘이었다. 빠진 확장자를 목록에 더 넣거나, <strong>목록을 없애거나.</strong> 앞을 고르면 다음에 Kotlin이나 Terraform을 쓸 때 또 같은 자리에 선다. 허용 목록은 늘 현실보다 늦다.'],
      ['pre','# 전 (확장자 허용 목록)\ntracked_files | grep -E \'\\.(ts|tsx|js|jsx|mjs|json|ya?ml|sh)$\' | xargs grep -lE ...\n\n# 후 (추적 파일 전부, 바이너리만 건너뜀)\ntracked_files | xargs grep -lIE ...'],
      ['p','<code>grep -I</code> 가 바이너리를 알아서 건너뛴다. 확장자를 열거할 이유가 사라진다.'],
      ['tbl','토큰을 넣은 파일|고치기 전|고친 뒤;.ts · .js · .json · .sh|차단|차단;.py · .java · .sql · .md · .txt|<b>통과</b>|<b>차단</b>;.rs · .yaml|<b>통과</b>|<b>차단</b>;바이너리(.bin)|건너뜀|건너뜀'],
      ['p','실제 저장소에 돌려 오탐이 없는 것도 확인했다. 추적 파일이 수천 개인데 걸리는 것은 없었다.'],
      ['p','이 원칙은 게이트에만 해당하지 않는다. 권한 검사, 입력 검증, 레이트 리밋처럼 <strong>막는 것이 일인 코드는 전부</strong> 막히는 경로를 테스트해야 한다. 정상 경로만 테스트한 밸리데이터는 테스트가 없는 것보다 위험하다.'],

      ['h2','만들면서 밟은 것'],
      ['p','비슷한 종류의 함정을 다른 곳에서도 만났다. macOS에 기본 설치된 bash는 3.2라서 동적 파일 디스크립터(<code>exec {fd}&gt;</code>)를 쓸 수 없다. Linux CI에서 멀쩡하던 스크립트가 로컬에서만 죽는다. <strong>"내 로컬에서만 되는 스크립트"는 대개 이런 자리에서 생긴다</strong>. 그리고 이 게이트가 없애려던 것이 정확히 그 현상이었다.'],
      ['honest','재보지 않은 것|게이트가 실제로 사고를 막은 횟수는 세지 않았다. 시크릿 검사가 잡은 것도 <b>내가 일부러 심은 것뿐</b>이라, 오탐률이나 실전 적중률은 알 수 없다. 그리고 <code>--no-verify</code>로 우회할 수 있다는 점은 그대로다. 이건 서버 쪽 검사로 보완해야 하는데 아직 안 했다.'],
      ['p','이 게이트는 남의 사례가 아니라 <strong>이 아카이브를 담고 있는 학습 저장소에 실제로 걸어 둔 것</strong>이다. 지금도 push 할 때마다 돈다.']

  'cipher':{grp:'보안·검증',t:'제휴사에 식별번호를 암호화해 보내야 했다',crumb:'Node 22 · JDK 17 · 블록 암호 모드',tech:['Node.js','Java'],tags:['보안'],
    lede:'연동 규격에 적힌 것은 "개인 식별번호는 암호화해서 전송" 한 줄이었다. 쓰고 있던 모듈을 열어보니 <strong>mode는 ECB, IV는 빈 문자열, 키는 클라이언트 환경변수</strong>였다. 셋 다 바꿔야 하는데 무엇부터 손대야 할지가 안 보였다.',
    body:[
      ['honest','이 글의 숫자는 언제 잰 것인가|당시 판단은 ECB를 버리고 CBC로 가는 데까지였다. 아래 숫자는 그 뒤 2026-09-15에 다시 돌려 얻은 값이다.'],

      ['h2','AES를 쓴다는 말에는 세 가지가 빠져 있다'],
      ['p','블록 암호는 평문을 16바이트씩 잘라 처리한다. 그 조각을 어떻게 이어붙일지(모드)와 어디서 시작할지(IV)를 따로 정해야 하고, 둘은 서로 다른 것을 책임진다.'],
      ['tbl','보장받고 싶은 것|그걸 정하는 자리;같은 값인지 숨기기|IV가 매번 달라야 한다;구조 숨기기|모드가 체이닝을 해야 한다;변조 감지|인증 태그가 있어야 한다'],
      ['p','그래서 "AES-256을 썼다"는 이 셋 중 무엇을 받았는지 말해주지 않는다. 쓰던 모듈은 ECB에 빈 IV였으니 셋 다 못 받고 있을 가능성이 높았다. 그럼 지금 정확히 무엇이 새고 있나. 거기서부터 쟀다.'],

      ['h2','같은 값을 천 번 암호화했더니 암호문이 하나였다'],
      ['p','같은 평문을 1,000회 암호화해 서로 다른 암호문이 몇 개 나오는지 셌다.'],
      ['tbl','모드|고유 암호문|같은 입력인지 판별;ECB|<b>1 / 1000</b>|가능;CBC + 고정 IV|<b>1 / 1000</b>|가능;CBC + 랜덤 IV|1000 / 1000|불가;GCM + 랜덤 nonce|1000 / 1000|불가'],
      ['p','고유 암호문이 1이면 복호화 없이도 암호문끼리 같은 값을 묶을 수 있다. 식별번호처럼 값의 가짓수가 정해진 필드에서는 그 묶음 자체가 정보다. 누구인지는 몰라도 "이 두 건은 같은 사람"이 공짜로 나온다.'],
      ['p','여기까지는 예상대로였다. ECB를 버리면 된다. 갈린 것은 무엇으로 바꿀지였다.'],

      ['h2','CBC로 바꿨는데 지역과 지점은 계속 샜다'],
      ['p','널리 퍼진 조언은 ECB를 피하라는 것이다. CBC는 앞 블록을 다음 블록에 섞으니 패턴이 감춰진다고 한다. 맞는 말인데 절반만 맞다. 누출을 두 종류로 나눠 재면 드러난다. 한 평문 안에서 같은 블록이 되풀이되는 것과, 서로 다른 두 건이 앞부분을 공유하는 것은 다른 일이다.'],
      ['pre','평문 A: REGION=SEOUL    |BRANCH=GANGNAM  |AMOUNT=000012000\n평문 B: REGION=SEOUL    |BRANCH=GANGNAM  |AMOUNT=000098000'],
      ['tbl','모드|내부 반복 (고유 블록 4개 중)|접두 공유 (공통 선두 블록);ECB|1 · 반복 구조 그대로|<b>2 / 3</b>;CBC + 고정 IV|4 · 막힘|<b>2 / 3</b>;CBC + 랜덤 IV|4 · 막힘|0 / 3'],
      ['p','CBC는 내부 반복을 막고 접두 공유는 못 막는다. 체이닝이 앞 블록에 의존하니 앞이 같으면 앞쪽 암호문도 같아지고, IV가 고정이면 그 "앞"이 첫 블록부터 시작한다. 금액만 다른 두 건에서 지역과 지점이 같다는 사실이 2블록분 나간다.'],
      ['p','<strong>고칠 대상은 모드가 아니라 IV였다.</strong> 조언을 문자 그대로 따르면 2/3이 계속 새는 상태로 안심하게 된다.'],
      ['p','다만 이 랩은 16바이트에 정렬된 평문을 썼다. 실제 페이로드가 정렬돼 있지 않으면 블록 경계가 어긋나 누출 폭이 달라진다. 그건 재지 않았다.'],

      ['h2','키가 없는데 평문이 원하는 값으로 바뀌었다'],
      ['p','재보다가 한 가지가 더 나왔다. CBC 복호화의 첫 블록은 <code>P0 = D(C0) XOR IV</code>다. IV는 보통 암호문과 같이 평문으로 실려 오니 받는 쪽에 닿기 전에 만질 수 있고, 원래 평문을 알면 <code>IV2 = IV XOR P0 XOR 원하는값</code>으로 바꾸면 된다. 키는 필요 없다.'],
      ['tbl','모드|조작한 것|복호화 결과|에러;CBC|IV 16바이트|<b>LIMIT=9999999999</b>|<b>안 남</b>;GCM|암호문 1비트|예외|태그 검증 실패'],
      ['p','<code>LIMIT=0000100000</code>이 <code>LIMIT=9999999999</code>가 됐고 <strong>복호화는 조용히 성공했다.</strong> 받는 쪽 코드에는 잘못된 값이 정상 값과 구별되지 않고 그대로 들어간다.'],
      ['p','IV를 고정해서 못 만지게 해도 막히지 않는다. 두 번째 블록부터는 <code>P1 = D(C1) XOR C0</code>라 앞 블록을 희생하면 다음 블록을 제어할 수 있다. 블록 하나가 읽을 수 없는 바이트로 깨지는 대신 원하는 값이 들어간다.'],
      ['p','이게 CBC와 GCM의 차이다. 비밀 유지가 아니라 변조 감지다. 여기까지 보면 GCM이 당연한 선택이다.'],
      ['p','덧붙이면, 여기서 건드린 것은 IV와 앞 블록뿐이다. 복호화 실패 유형을 구분해 응답할 때 생기는 패딩 오라클은 만들지 않았다.'],

      ['h2','GCM을 포기하게 만든 건 알고리즘이 아니었다'],
      ['p','그런데 현장에서는 플랫폼 호환성을 이유로 CBC로 후퇴하는 결정이 자주 난다. 그 호환성 문제의 정체를 재봤다. 같은 평문과 같은 키로 네 가지 배치를 만들고, 받는 쪽이 <code>iv(12) + ct + tag(128bit)</code> 하나만 가정하고 열었다.'],
      ['tbl','보낸 배치 (붙인 순서)|결과|예외;iv + ct + tag|<b>POLICY=P-2026-000123</b>|없음;iv + tag + ct|실패|AEADBadTagException;iv(16) + ct + tag|실패|AEADBadTagException;iv + ct + tag(96bit)|실패|AEADBadTagException'],
      ['p','네 줄 모두 같은 알고리즘이고 같은 키다. 한쪽은 태그를 따로 돌려주고 붙이는 일을 개발자에게 맡기는데, 다른 쪽은 태그가 이미 끝에 붙어 나온다. 양쪽이 당연하다고 여긴 배치가 다르면 어긋나고, 태그를 어디에 붙일지는 규격에 없다.'],
      ['p','더 나쁜 것은 <strong>원인이 셋인데 에러 이름이 하나</strong>라는 점이다. 태그 위치와 IV 길이와 태그 길이가 전부 같은 예외로 나온다. 에러만 보고는 구별할 수 없으니 "플랫폼 간 호환성 문제"로 분류되고, 그러면 알고리즘을 바꾸는 쪽으로 기운다. 실제 원인은 규격서에 배치를 바이트 단위로 안 적은 것이다.'],
      ['p','다만 실제로 돌려본 것은 Node와 Java 한 쌍뿐이다. 다른 언어 조합에서 이 셋 말고 또 갈리는 자리가 있는지는 모른다.'],

      ['h2','그래서 순서를 이렇게 잡았다'],
      ['p','IV를 매번 새로 뽑는 것이 먼저다. 모드를 바꾸는 것보다 효과가 크고 비용이 거의 없다. 앞에서 나가던 2블록은 이것만으로 0이 된다.'],
      ['p','그다음이 변조 감지다. GCM을 쓰거나, CBC를 유지하고 인증 코드를 따로 붙이거나 둘 중 하나다. 후자를 고른다면 무엇을 포기했는지 적어둬야 한다. 이 랩에서 잰 것으로 말하면 "키 없는 평문 변조가 에러 없이 통과한다"는 항목이고, <strong>그건 자동으로 따라오지 않는다.</strong>'],
      ['p','호환성이 GCM을 버리는 이유라면, 라이브러리를 바꾸기 전에 배치를 규격에 못 박는 것이 먼저다. 이 랩에서 실패한 세 줄은 그것만으로 사라진다.'],
      ['p','남은 것은 키다. 클라이언트에서 암호화하려면 키가 클라이언트에 있어야 하고, 그러면 어떤 난독화로도 은닉되지 않는다. 이건 모드로 풀리는 문제가 아니라 암호화를 어디서 하느냐의 문제라 이 랩에서는 재지 않았다. 성능도 마찬가지로 재지 않았다. GCM과 CBC의 처리량은 선택 근거로 자주 언급되는데 따로 재야 하는 값이다.'],
      ['p','시나리오는 제휴사 연동에서 개인 식별정보를 전송해야 했던 상황에서 가져왔고, 식별번호 실값은 쓰지 않았다. 평문은 전부 계약 식별자 형태로 바꿨다. 규격 출처는 <a href="https://csrc.nist.gov/pubs/sp/800/38/d/final" target="_blank" rel="noreferrer">NIST SP 800-38D</a>다.']
    ],meta:'Node 22 · Zulu JDK 17 · 의존성 0 (표준 crypto만) · 2026-09-15'},
  'checkdigit':{grp:'보안·검증',t:'실재하지 않는 번호인데 가입이 진행됐다',crumb:'Node 22 · 체크 디짓',tech:['Node.js'],tags:['데이터 정합','보안'],
    lede:'프론트 검증을 통과한 값이 실명인증 요청까지 들어갔고, 사용자는 "이런 번호가 왜 되냐"고 물었다. 웹과 앱 전부 같았으니 채널별 로직 차이가 아니다. 로직 오류를 찾으러 들어갔는데 <strong>로직은 맞았다. 틀린 건 검증에 건 기대였다.</strong>',
    body:[
      ['honest','이 글의 숫자는 언제 잰 것인가|당시에는 원인을 정리하고 사건을 닫는 데까지였다. 아래 숫자는 그 뒤 2026-09-15에 다시 돌려 얻은 값이다.'],
      ['h2','로직이 맞는데 결과가 틀렸다면'],
      ['p','로직이 맞는데 결과가 틀렸다면 코드를 더 파는 대신 <strong>이 장치가 무엇을 보장하는지</strong>를 의심해야 한다.'],
      ['ul','아무렇게나 찍은 번호가 통과할 확률은 얼마인가|그럼 이 장치는 쓸모가 없나. 원래 무엇에 답하나|더 촘촘한 방식으로 바꾸면 실재성까지 답해주나'],

      ['h2','체크 디짓은 마지막 한 자리로 앞자리를 요약한다'],
      ['p','앞자리들에 가중치를 곱해 더하고, 그 합을 어떤 수로 나눈 나머지를 마지막 자리에 넣는다. 받는 쪽은 같은 계산을 다시 해서 맞는지 본다. 방식마다 가중치와 나누는 수가 다른데, <strong>실제로 결과를 가르는 것은 체크값이 몇 가지냐</strong>뿐이다.'],

      ['h2','무작위 번호 열 개 중 하나가 통과했다'],
      ['p','무작위 숫자열 200,000개를 그대로 검증에 넣었다.'],
      ['tbl','방식|체크값 가짓수|무작위 통과|통과율|이론값;가중치 mod-11 (13자리)|10|19,990 / 200,000|<b>9.99%</b>|10.00%;Luhn (16자리 카드번호)|10|20,050 / 200,000|<b>10.03%</b>|10.00%;mod-97 (IBAN 방식)|97|2,038 / 200,000|<b>1.02%</b>|1.03%;검증 없음|1|200,000 / 200,000|100.00%|100.00%'],
      ['p','통과율이 <strong>체크값 가짓수의 역수로 정확히 떨어진다.</strong> 알고리즘의 정교함과는 무관하다. mod-11과 Luhn은 설계가 전혀 다른데 통과율이 같고, 이유는 둘 다 체크값이 10가지라서다.'],
      ['p','13자리 번호 공간 가운데 10분의 1이 검증을 통과한다. 실제로 발급된 번호가 아무리 많아도 자릿수가 한참 아래다. "검증을 통과했으니 실재한다"고 읽으면 거의 전부를 실재로 착각하는 셈이다.'],

            ['p','여기 쓴 "1만분의 1"은 번호 공간과 발급 규모의 자릿수로 낸 어림이지 측정이 아니다. 실제 발급 번호의 분포는 모르고, 구조 때문에 유효 공간이 더 좁으면 실재 비율은 올라간다. 방향은 맞지만 값은 대략이다.'],
      ['h2','대신 오타는 거의 다 잡는다'],
      ['p','유효한 번호에 오타를 내고 검증이 잡아내는 비율을 쟀다.'],
      ['tbl','오타 유형|mod-11|Luhn|mod-97;한 자리 잘못 누름|98.32%|<b>100.00%</b>|<b>100.00%</b>;인접 두 자리 바꿔 누름|97.92%|97.73%|<b>100.00%</b>;한 칸 건너 두 자리 바꿔 누름|97.89%|<b>0.00%</b>|<b>100.00%</b>;두 자리 잘못 누름|89.34%|89.81%|99.27%'],
      ['p','무작위 값은 10개 중 1개를 통과시키면서 오타는 90에서 100퍼센트까지 잡는다. 이게 체크 디짓의 정체다. 사람이 손으로 옮겨 적다 틀리는 것을 잡으려고 만들어졌고 그 일은 아주 잘한다. <strong>문제는 아무도 그 질문을 하지 않았다는 것이다.</strong>'],

            ['p','사람이 실제로 내는 오타 분포는 쓰지 않았다. 네 유형을 균등하게 뽑았는데 현실에서는 인접 전치가 훨씬 드물다. 유형별 빈도를 넣으면 종합 검출률은 달라진다.'],
      ['h2','표에서 두 칸이 이론과 달랐다'],
      ['p','mod-11은 이론상 한 자리 오류를 전부 잡아야 한다. 11이 소수라 가중치와 변화량의 곱이 11의 배수가 될 수 없기 때문이다. 그런데 98.32%가 나왔다. 실제 구현이 <code>(11 - sum%11) % 10</code>을 쓰기 때문이었다. 뒤의 <code>% 10</code>은 체크값이 10이 나오는 걸 피하려고 붙는다.'],
      ['tbl','체크값|이 값을 내는 가중합|겹침;0|sum%11=1|없음;<b>1</b>|<b>sum%11=0, sum%11=10</b>|<b>있음</b>;2|sum%11=9|없음'],
      ['tbl','방식|체크값 가짓수|한 자리 오류 검출;mod-11 (접음, 실제 구현)|10|98.11%;mod-11 (접지 않음)|11|<b>100.00%</b>'],
      ['p','접지 않으면 100%가 된다. 대신 체크값에 숫자가 아닌 기호가 하나 필요하다. ISBN의 <code>X</code>가 그것이다. <strong>숫자만 쓰겠다는 결정이 검출률 2%를 가져갔다.</strong>'],
      ['p','Luhn의 0.00%는 측정 오류처럼 보이지만 맞는 값이다. Luhn은 오른쪽에서 한 칸 건너 2배를 하므로 두 칸 떨어진 자리는 같은 가중치라 맞바꿔도 합이 변하지 않는다.'],
      ['pre','원래 번호  2969083009954562   가중합 80\n바꾼 번호  6929083009954562   가중합 80   ← 0번째와 2번째를 맞바꿈'],
      ['note','0%는 낮은 게 아니라 다른 것이다|검출률이 낮은 것과 0인 것은 다르다. 0은 "가끔 놓친다"가 아니라 <b>이 유형은 원리상 못 잡는다</b>는 뜻이고, 그건 코드를 고쳐서 나아지지 않는다. 방식을 바꾸는 수밖에 없다.'],

      ['h2','검증과 실재성 판단을 갈라 놓는다'],
      ['p','체크 디짓은 입력 실수를 잡는 자리에 두고, 실재성 판단은 발급 기관 응답에만 맡긴다. 둘을 같은 자리에 두면 앞의 답을 뒤의 답으로 읽게 된다. 이번 건에서 실제로 고친 것도 프론트 검증이 아니라 가입을 확정하는 지점이었다.'],
      ['p','통과율을 더 낮추고 싶다면 알고리즘이 아니라 체크값 가짓수를 키워야 한다. mod-97로 가면 10분의 1이 100분의 1이 된다. 다만 <strong>아무리 키워도 실재성은 나오지 않는다.</strong> 1%도 여전히 어마어마한 수의 가짜를 통과시킨다.'],

            ['p','그렇다고 mod-97이 항상 낫다고 말할 수는 없다. 체크값 두 자리를 더 쓰는 비용이 있고 사람이 불러주기 어려운 형식이 된다. 여기서는 검출력만 쟀다.'],
      ['p','시나리오는 검증을 통과한 값이 인증 단계까지 들어갔던 사건에서 가져왔다. <strong>식별번호 실값과 그 구조는 쓰지 않았고</strong> 검증 방식만 일반형으로 옮겼다. 번호는 전부 무작위 생성이다.']

    body:[

      ['p','App Router에서 가장 자주 하는 결정인데 잘못 그어도 증상이 없다. 화면은 같고, 동작도 같고, 에러도 안 난다. 빌드 출력의 숫자를 들여다보지 않으면 모른다. 그래서 같은 화면을 내는 페이지를 네 개 만들고 경계 위치만 바꿔가며 쟀다.'],
      ['p','무거운 모듈은 134KB짜리 리터럴로 흉내냈고 안에 마커 문자열을 심었다. 빌드 산출물에서 그 마커를 찾으면 <strong>클라이언트로 넘어갔는지를 예·아니오로</strong> 알 수 있다. 바이트 차이만 보는 것보다 분명하다.'],

      ['h2','경계 위치만 바꿨는데 83kB가 움직인다'],
      ['tbl','경계|First Load JS|초기 HTML|번들에 무거운 것;페이지 최상단이 use client|<b>185 kB</b>|4 KB|<b>실림</b>;잎만 use client|<b>102 kB</b>|4 KB|안 실림;클라이언트가 서버 자식을 감쌈|103 kB|5 KB|안 실림;서버가 읽어 props로 넘김|103 kB|<b>135 KB</b>|안 실림'],
      ['p','공유 청크는 네 경우 모두 102kB로 같다. 늘어난 83kB는 전부 그 라우트 몫이다.'],

      ['h2','use client는 파일이 아니라 그래프에 붙는다'],
      ['p','이 지시어를 "이 파일을 클라이언트로 보낸다"로 읽으면 첫 줄이 설명되지 않는다. 정확히는 <strong>그 파일이 import하는 것이 전부 따라간다.</strong> 버튼에 상태가 필요해 페이지 최상단에 붙였더니 같은 파일이 import하던 무거운 모듈이 함께 건너갔다.'],
      ['p','마커로 확인하면 분명하다. 빌드된 클라이언트 청크 안에서 마커가 발견되는 라우트는 첫 줄 하나뿐이고, 나머지 셋은 서버 산출물에만 있다.'],
      ['p','고치는 법은 단순하다. 상태가 필요한 것은 버튼뿐이니 그 버튼만 떼어내고 페이지는 서버 컴포넌트로 둔다. 185kB가 102kB가 되고 화면은 한 픽셀도 안 바뀐다.'],

      ['h2','감싸야 할 때는 children으로 받는다'],
      ['p','잎으로 내리지 못하는 경우가 있다. 접었다 펴는 패널처럼 무거운 내용을 <strong>감싸야</strong> 할 때다. 이때도 자식을 직접 import하지 않고 자리만 비워두면 된다.'],
      ['pre','// 클라이언트 컴포넌트는 children 이 무엇인지 모른다. 자리에만 꽂는다.\n&lt;Panel&gt;&lt;p&gt;{summarize()}&lt;/p&gt;&lt;/Panel&gt;'],
      ['p','103kB. 잎으로 내린 것과 사실상 같다. 상호작용은 클라이언트가 맡고 무거운 것은 서버에 남는다.'],

      ['h2','번들에서 뺐다고 전송이 사라진 것은 아니다'],
      ['p','여기서 흔한 대답이 하나 나온다. "서버에서 읽어서 props로 넘기면 되지 않나." 그리고 흔히 보는 지표로는 통과한다. First Load JS 103kB, 클라이언트 번들에 마커 없음. 둘 다 잎으로 내린 것과 같은 값이다.'],
      ['p','그런데 초기 HTML이 4KB에서 135KB가 된다.'],
      ['p','클라이언트 컴포넌트에 넘긴 props는 직렬화되어 초기 응답에 실린다. JS 번들에서는 빠졌지만 <strong>같은 바이트가 다른 통로로 간다.</strong> 옮겨놓고 줄였다고 읽기 쉬운 자리다.'],
      ['note','한 숫자만 보면 갈리지 않는다|First Load JS 만 보면 첫 줄만 나쁘고 마지막 줄은 멀쩡해 보인다. 번들에 실렸는지만 보면 결론이 같다. <b>두 숫자를 같이 놓아야</b> 마지막 줄이 드러난다. 지표 하나로 판정하는 습관이 여기서 걸린다.'],

      ['h2','그래서 어떤 순서로 정하나'],
      ['p','상태가 필요한 만큼만 떼어내는 것이 먼저다. 버튼 하나 때문에 페이지를 넘길 이유가 없고 떼어내도 화면은 같다. 감싸야 한다면 <code>children</code>으로 받는다.'],
      ['p','props로 넘기기로 했다면 넘기는 양을 재야 한다. 번들 크기만 보고 끝내면 초기 응답이 커진 것을 놓친다. 필요한 만큼 잘라 넘기거나 클라이언트에서 따로 가져오는 방법이 있는데, 그 비용 비교는 이 랩에서 하지 않았다.'],
      ['honest','재보지 않은 것|<b>실제 라이브러리를 쓰지 않았다.</b> 134KB 리터럴로 흉내냈고, 실제 라이브러리는 트리 셰이킹이 되므로 import 방식에 따라 실리는 양이 달라진다. 여기서는 통째로 실리는 경우만 봤다. <b>런타임 성능도 재지 않았다.</b> 파싱·실행 시간이나 상호작용 지연은 다루지 않았다. 바이트가 줄면 대개 같이 줄지만 그건 이 랩이 잰 것이 아니다. 그리고 <b>여기 숫자는 네트워크 전송량이 아니라 빌드 산출물 크기다.</b> 실제로는 압축되어 나가고 두 통로의 압축률이 다를 수 있는데 그 차이는 재지 않았다.'],
      ['p','이 편은 실무에서 가져온 상황이 아니라 <strong>App Router를 쓰면서 매번 마주치는 결정</strong>을 직접 세워 잰 것이다. 무거운 모듈은 생성 스크립트가 만들고, 저장소에는 그 스크립트만 둔다.']
    ],meta:'Next.js 15.5.20 · React 19 · 빌드 산출물 크기 · 고정 시드 생성물 · 2026-09-16'},
  'pii':{grp:'보안·검증',t:'마스킹을 넣었는데 식별정보가 그대로 도착했다',crumb:'Node 22 · 에러 수집 경로',tech:['Node.js'],tags:['경계 설계','보안'],
    lede:'에러 리포터에 개인정보 마스킹을 붙여 뒀다. 로거를 통해 보내는 건 깨끗하다. 그런데 수집기를 열어보면 마스킹 안 된 것이 섞여 있다. <strong>앱이 보낸 적 없는 에러들이다.</strong>',
    body:[
      ['honest','이 글의 숫자는 언제 잰 것인가|당시에는 로거 경로에만 마스킹이 걸려 있다는 것을 문서에 적어두는 데까지였다. 아래 숫자는 그 뒤 2026-09-16에 최소 리포터를 세워 다시 돌려 얻은 값이다.'],

      ['h2','앱 코드만 보면 전부 통과한다'],
      ['p','에러 리포터에는 경로가 둘이다. 앱이 직접 부르는 길과, SDK가 전역 훅으로 알아서 잡는 길. 앞은 로거를 지나고 뒤는 지나지 않는다. 그리고 <strong>사람이 예상 못 한 에러가 가는 길이 뒤쪽이다.</strong>'],
      ['p','코드를 읽어서는 안 갈린다. 로거에 마스킹이 붙어 있으면 그 줄은 멀쩡해 보인다. 그래서 수집기를 직접 세우고 <strong>도착한 것만</strong>으로 판정했다. 자동 경로도 흉내내지 않고 자식 프로세스에서 실제로 예외를 던져 전역 훅이 보내게 했다.'],

      ['h2','마스킹을 로거에 두면 자동 경로가 통째로 샌다'],

      ['p','명시 경로는 세 경우 모두 0건이다. 앱 코드만 보면 세 줄이 다 통과한다. 갈리는 것은 앱을 거치지 않는 쪽이고, 그쪽은 코드에 흔적이 없다.'],

      ['h2','한 자리가 아니라 다섯 자리다'],
      ['p','마스킹이 로거에만 있을 때 자동 경로가 싣고 온 자리를 갈라 셌다.'],

      ['p','그래서 <code>message</code>만 훑는 절반짜리 마스킹은 7건 중 2건만 지운다. 남은 5건은 그대로 간다. 앞 표의 가운데 줄이 그것이다.'],
      ['p','<code>request</code>가 둘인 것도 눈여겨볼 만하다. URL 쿼리스트링과 요청 본문에 각각 하나씩 들어 있다. <strong>에러 메시지만 조심하면 된다고 생각하기 쉬운 자리다.</strong>'],

      ['h2','그래서 어디에 두나'],
      ['p','두 경로가 만나는 가장 아래 지점에 둔다. 이 랩에서는 전송 직전의 훅이다. 그리고 특정 필드가 아니라 나가는 페이로드 전체를 훑는다.'],
      ['p','호출부에 두면 호출부를 안 지나는 경로가 남고, 필드를 골라 훑으면 안 고른 필드가 남는다. <strong>둘 다 "넣었는데 샌다"로 나타난다.</strong> 같은 모양을 앞에서도 봤다. 인증 판단이 응답보다 뒤에 있으면 그것은 경계가 아니라는 것과 같은 이야기다.'],
      ['note','넣었다는 것은 증거가 아니다|보낸 쪽 코드가 아니라 <b>받은 쪽에 무엇이 도착했는지</b>로 판정해야 한다. 그러려면 받는 쪽을 열어볼 수 있어야 하는데, 실제 서비스에서는 그게 외부 도구라 들여다보기 어렵다. 그래서 이 랩은 수집기부터 직접 세웠다.'],
      ['honest','재보지 않은 것|<b>실제 SDK를 쓰지 않았다.</b> 두 경로와 전송 훅만 남긴 최소 리포터를 세웠다. 실제 제품은 세션 리플레이·소스맵·자동 브레드크럼까지 싣고 그만큼 샐 자리도 많다. <b>여기서 센 7건은 하한이다.</b> 브라우저 쪽도 다루지 않았다. 같은 모양의 자동 경로가 있는데 Node 쪽만 재봤다. 마스킹 규칙의 정확도(오탐·미탐)와 페이로드 전체를 훑는 비용도 재지 않았다. 에러가 몰릴 때 그 비용이 얼마인지는 따로 재야 한다.'],
      ['p','시나리오는 에러 관측 도구를 점검하다 마스킹이 한쪽 경로에만 걸려 있는 것을 발견한 상황에서 가져왔다. 도구 이름과 설정은 쓰지 않았고 <strong>식별번호 실형식도 쓰지 않았다.</strong> 카드번호꼴과 이메일로 바꿨다.']

  'passing':{grp:'관점',t:'통과했다는 말이 증명하지 않는 것',crumb:'네 가지를 한 글자가 덮는다',tech:[],tags:['진단','경계 설계'],

      ['h2','셋째, 이 경로에서만 통과다'],

      ['p','중복 제출을 막을 때도 같았다. 방어를 네 층 얹었는데 같은 연타로 재보니 여섯 가지 중 실제로 막은 것은 둘이었다. 나머지 넷 중 셋은 방어가 얹혀 있는 상태였다.'],
      ['p','조치를 호출부에 두면 호출부를 안 지나는 경로가 남는다. 그래서 통과를 볼 때는 어느 경로로 들어온 통과인지를 같이 봐야 한다.'],

  function buildNav(active){
    var n=$('nav'), term=($('q').value||'').trim().toLowerCase(), hits=0;
    n.innerHTML='';
    GRPS.forEach(function(g){
      var items=ORDER.filter(function(k){
        if(PAGES[k].grp!==g) return false;
        if(!term) return true;
        var p=PAGES[k];
        // 제목에는 줄바꿈을 막으려고 넣은 U+00A0 이 섞여 있다. 검색어는 일반 공백으로

        return (p.t+' '+p.crumb+' '+(p.tags||[]).join(' ')+' '+(p.tech||[]).join(' ')+' '+plain(p.lede))
          .replace(/\u00a0/g,' ').toLowerCase().indexOf(term)>=0;
      });
      if(!items.length) return;
      hits+=items.length;
      var d=document.createElement('div'); d.className='grp';
      d.innerHTML='<h4>'+g+'<span class="c">'+items.length+'</span></h4>';
      items.forEach(function(k){
        var a=document.createElement('a'); a.href='#'+k;
        a.innerHTML='<span class="i">'+('0'+(ORDER.indexOf(k)+1)).slice(-2)+'</span><span>'+esc(PAGES[k].t)+'</span>';
        if(k===active) { a.className='on'; a.setAttribute('aria-current','page'); }
        d.appendChild(a);
      });
      n.appendChild(d);
    });

  /* ───────────────── body blocks ───────────────── */

    return arr.map(function(b){
      var tag=b[0], v=b[1];
      if(tag==='demo') return dk&&DEMOS[dk]
        ? '<div class="demo-tag">'+(v||'직접 조작해보기')+'</div>'+DEMOS[dk].html() : '';
      if(tag==='h2') return '<h2 id="'+v.replace(/[^0-9A-Za-z가-힣]+/g,'-')+'">'+v+'</h2>';
      if(tag==='p')  return '<p>'+v+'</p>';
      if(tag==='pre')return '<pre>'+v+'</pre>';
      if(tag==='fig')return FIG[v]||'';
      if(tag==='ul') return '<ul>'+v.split('|').map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul>';
      if(tag==='note'){var p=v.split('|');return '<div class="note"><b>'+p[0]+'</b>'+p[1]+'</div>'}
      if(tag==='honest'){var q=v.split('|');return '<div class="honest"><b>'+q[0]+'</b>'+q[1]+'</div>'}
      if(tag==='tbl'){
        var rows=v.split(';').map(function(r){return r.split('|')});
        var h='<div class="tblwrap"><table><thead><tr>'+rows[0].map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr></thead><tbody>';
        for(var i=1;i<rows.length;i++) h+='<tr>'+rows[i].map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>';
        // 셀 안에 &lt; 를 직접 쓰면 그 ';' 가 행 구분자로 먹힌다. [[lt]] 로 적고 여기서 되돌린다.
        return (h+'</tbody></table></div>').replace(/\[\[lt\]\]/g,'&lt;').replace(/\[\[gt\]\]/g,'&gt;');
      }
      return '';

  /* ───────────────── render ───────────────── */

  function slug(v){ return v.replace(/[^0-9A-Za-z가-힣]+/g,'-'); }
  function tocHTML(p){

      '<button class="lbl" type="button" aria-expanded="true" aria-controls="toc-list">이 글의 흐름'+

  var RAIL=window.matchMedia('(min-width:1301px)');

  function setToc(open){
    var d=document.querySelector('.toc'); if(!d) return;
    d.classList.toggle('closed',!open);

  }
  function syncToc(){ setToc(true); }

  /* 지금 읽고 있는 절을 목차에 표시한다. 화면 위쪽 기준선을 마지막으로 넘어간 h2 가 현재다. */
  var tocLinks=[], tocTargets=[];
  function indexToc(){
    tocLinks=[].slice.call(document.querySelectorAll('.toc a'));
    tocTargets=tocLinks.map(function(a){ return document.getElementById(a.getAttribute('href').slice(1)); });
  }
  function spy(){
    if(!tocLinks.length) return;
    var cur=0;
    for(var i=0;i<tocTargets.length;i++){
      if(tocTargets[i] && tocTargets[i].getBoundingClientRect().top<=140) cur=i;
    }
    // 끝까지 내려가면 마지막 절을 잡는다. 마지막 절이 짧으면 기준선을 못 넘기 때문이다.
    if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-4) cur=tocLinks.length-1;
    tocLinks.forEach(function(a,i){ a.classList.toggle('on',i===cur); });
  }
