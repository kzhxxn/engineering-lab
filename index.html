    var cur=document.documentElement.getAttribute('data-theme');
    if(!cur) cur=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
    var next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{ localStorage.setItem('lab-theme',next); }catch(e){}
    paintTheme();
  }

    var j=i+delta;

    else if(j<ORDER.length) location.hash='#'+ORDER[j];
  }

  var O1=[{k:'begin',t:'BEGIN'},{k:'read',t:'SELECT count(*) WHERE on_call'},{k:'write',t:"UPDATE … name='alice'"},{k:'commit',t:'COMMIT'}];
  var O2=[{k:'begin',t:'BEGIN'},{k:'read',t:'SELECT count(*) WHERE on_call'},{k:'write',t:"UPDATE … name='bob'"},{k:'commit',t:'COMMIT'}];
  var H=['완전히 겹침: 둘 다 같은 스냅샷','거의 겹침: T2가 한 박자 늦게','절반 겹침: T1이 쓰기까지 진행한 뒤','살짝 겹침: T1 커밋 직전','겹치지 않음. T2는 결과를 보고 시작'];
  var iso='RR',off=0,tl=[],cur=0,timer=null;

  function build(){ tl=[]; var n=Math.max(O1.length,off+O2.length);
    for(var i=0;i<n;i++){ if(i<O1.length) tl.push({tx:1,op:O1[i],slot:i});
      var j=i-off; if(j>=0&&j<O2.length) tl.push({tx:2,op:O2[j],slot:i}); } }

  function sim(upto){
    var rows=[{n:'alice',c:true},{n:'bob',c:true}],snap={1:null,2:null},seen={1:null,2:null},
        pend={1:null,2:null},cm={1:false,2:false},ab={1:false,2:false},log=[],rd={1:false,2:false},tg={1:'alice',2:'bob'};
    for(var i=0;i<=upto&&i<tl.length;i++){
      var e=tl[i],tx=e.tx,k=e.op.k; if(ab[tx])continue;
      if(k==='begin'){snap[tx]=rows.map(function(r){return{n:r.n,c:r.c}});log.push({tx:tx,s:'BEGIN ISOLATION LEVEL '+(iso==='RR'?'REPEATABLE READ':'SERIALIZABLE')});}
      else if(k==='read'){var src=snap[tx]||rows,c=src.filter(function(r){return r.c}).length;seen[tx]=c;rd[tx]=true;
        log.push({tx:tx,s:'SELECT count(*) WHERE on_call → '+c+"   ('2명이니 빠져도 되겠다')"});}
      else if(k==='write'){pend[tx]=tg[tx];log.push({tx:tx,s:"UPDATE doctors SET on_call=false WHERE name='"+tg[tx]+"'"});}
      else{var o=tx===1?2:1,lap=snap[o]!==null&&!cm[o]&&rd[o];
        if(iso==='SER'&&rd[tx]&&pend[tx]&&lap){ab[tx]=true;
          log.push({tx:tx,err:1,s:'ERROR: could not serialize access due to read/write dependencies'});
          log.push({dim:1,s:'→ 앱은 이 트랜잭션을 재시도해야 한다'});continue;}
        if(pend[tx])rows.forEach(function(r){if(r.n===pend[tx])r.c=false;});
        cm[tx]=true;log.push({tx:tx,s:'COMMIT ✓'});}
    }
    return{rows:rows,seen:seen,log:log,ab:ab};
  }

  function draw(){
    var mx=Math.max(O1.length,off+O2.length);
    [1,2].forEach(function(tx){
      var el=$(tx===1?'r1':'r2'); el.innerHTML=''; el.style.gridTemplateColumns='repeat('+mx+',minmax(0,1fr))';
      for(var s=0;s<mx;s++){ var idx=-1;
        for(var i=0;i<tl.length;i++) if(tl[i].tx===tx&&tl[i].slot===s){idx=i;break;}
        var d=document.createElement('div');
        if(idx>=0){ d.className='op t'+tx+(idx<cur?' done':'')+(idx===cur-1?' cur':''); d.textContent=tl[idx].op.t; d.title=tl[idx].op.t; }
        else { d.className='op'; d.style.visibility='hidden'; d.textContent='·'; }
        el.appendChild(d);
      }
    });
    var r=sim(cur-1);
    if(r.ab[1]||r.ab[2]){ var at=r.ab[1]?1:2, ks=$(at===1?'r1':'r2').querySelectorAll('.op.done');
      if(ks.length) ks[ks.length-1].classList.add('abrt'); }
    $('tbl').innerHTML=r.rows.map(function(x){return '<tr><td>'+x.n+'</td><td class="'+(x.c?'on':'off')+'">'+x.c+'</td></tr>'}).join('');
    $('s1').textContent=r.seen[1]===null?'—':r.seen[1];
    $('s2').textContent=r.seen[2]===null?'—':r.seen[2];
    var rem=r.rows.filter(function(x){return x.c}).length, done=cur>=tl.length;
    $('fin').textContent=done?rem:'—'; $('fin').className='big'+(done?(rem===0?' violate':' safe'):'');
    $('fin-h').textContent=done?(rem===0?'규칙 위반: 아무도 없다':'규칙이 지켜졌다'):'진행 중…';
    $('log').innerHTML=r.log.map(function(l){var c=l.err?'l-err':(l.dim?'l-dim':(l.tx===1?'l-t1':'l-t2'));
      return '<div class="'+c+'">'+(l.dim?'    ':('T'+l.tx+'  '))+l.s+'</div>'}).join('');
    $('log').scrollTop=$('log').scrollHeight;
    var v=$('vd');
    if(!done){v.className='verdict pending';v.innerHTML='<span class="mk">·</span><div><b>진행 중</b>단계를 넘겨 두 트랜잭션이 어떻게 엮이는지 보자.</div>';}
    else if(rem===0){v.className='verdict violate';v.innerHTML='<span class="mk">✕</span><div><b>WRITE SKEW 발생</b>둘 다 "2명"을 보고 각자 빠졌다. 서로 다른 행이라 스냅샷 격리가 충돌을 감지하지 못했다.</div>';}
    else if(r.ab[1]||r.ab[2]){v.className='verdict safe';v.innerHTML='<span class="mk">✓</span><div><b>직렬화 실패로 차단</b>읽기·쓰기 의존성이 감지돼 커밋이 거부됐다.</div>';}
    else{v.className='verdict safe';v.innerHTML='<span class="mk">✓</span><div><b>규칙 유지</b>겹치지 않아 뒤 트랜잭션이 앞의 결과를 보고 판단했다.</div>';}
    $('sc').textContent=cur+' / '+tl.length; $('stepb').disabled=cur>=tl.length;
  }
  function reset(){ if(timer){clearInterval(timer);timer=null;$('play').innerHTML=ICON.play+' 실행';} cur=0; build(); draw(); }
  function step(){ if(cur<tl.length){cur++;draw();} if(cur>=tl.length&&timer){clearInterval(timer);timer=null;$('play').innerHTML=ICON.play+' 실행';} }

  /* ═══════════════════ 데모 2: 레이스: 작업량이 버그를 숨긴다 ═══════════════════

  var RACE_SWEEP=[

  /* ═══════════════════ 데모 3: N+1: 쿼리를 센다 ═══════════════════
     쿼리 횟수는 결정적이라(3회 재실행에도 21/1/2 불변) 전 구간 계산한다.
     ms는 실제로 잰 4개 지점에서만 보여준다. */
  var NP_MS={10:{lazy:4.8,join:0.9},50:{lazy:17.4,join:0.9},100:{lazy:37.0,join:1.2},200:{lazy:62.7,join:2.0}};
  var NP_STRAT=[

    {k:'join',  n:'페치 조인',      q:function(){return 1},    d:'조인 한 방: N과 무관'},
    {k:'batch', n:'IN절 배치',      q:function(){return 2},    d:'팀 1번 + IN절 1번'}
  ];

          '</div></div>'+

     c:1, e:'조합 중간값까지 전부 <code>input</code> 이벤트를 만들고, 수정 전 구현은 조합 여부를 보지 않으므로 <b>세 번 다 커밋</b>한다.'},
    {q:'영문 <code>abc</code>를 입력하면 수정 전과 수정 후의 커밋 횟수가 같다. 왜인가?',
     o:['영문은 커밋이 비동기로 묶이기 때문','정규화 함수가 영문을 건너뛰기 때문','조합 구간이 없어 <code>isComposing</code>이 참이 되지 않고, 그래서 수정된 분기를 아예 안 타기 때문','uncontrolled로 자동 전환되기 때문'],
     c:2, e:'이게 <b>버그가 배포까지 가는 이유</b>다. 테스트를 영문으로 짜면 두 구현을 구분할 방법이 없다.'},
    {q:'조합 여부를 담는 변수를 <b>리렌더를 유발하지 않는 쪽</b>(React라면 ref)에 두는 이유는?',
     o:['메모리를 덜 쓰기 때문','<code>onChange</code> 안에서 <b>지금 이 순간</b> 값을 동기적으로 읽어야 하는데, 상태 갱신은 다음 렌더까지 반영되지 않기 때문','전역 상태와의 충돌을 피하려고','조합 상태를 화면에 그려야 하기 때문'],
     c:1, e:'반대로 조합 중 <b>표시값</b>은 화면을 바꿔야 하므로 리렌더를 유발하는 쪽이어야 한다. 같은 조합 상태인데 <b>읽는 시점이 달라서</b> 그릇이 갈린다.'},
    {q:'<code>input.value</code>를 바깥에서 되쓸 때 캐럿(커서)은 어떻게 되는가?',
     o:['항상 원래 위치에 남는다','항상 끝으로 간다','같은 값이면 유지되고, 값이 달라지면 끝으로 간다','브라우저마다 완전히 다르다'],
     c:2, e:'실제로 재본 결과다. 같은 값이면 브라우저가 건너뛴다. 그래서 커밋 경로의 정규화가 값을 <b>한 글자라도</b> 바꾸면 커서가 튄다.'},
    {q:'그 실험이 <b>재현하지 못한</b> 것은?',
     o:['커밋 횟수','리렌더 횟수','캐럿 이동','실제 IME 조합 버퍼가 깨지는 장면'],
     c:3, e:'합성 <code>CompositionEvent</code>는 브라우저 내부 IME 세션을 만들지 않는다. "그래서 조합이 깨진다"는 <b>실제 기기 관찰</b>이지 랩에서 재현한 것이 아니다.'}
  ];
  var XD_CODE='PASS-DUT6';

  DEMOS['xd']={
    html:function(){
      // 답 위치를 문항마다 섞는다. 렌더할 때 한 번만.
      var qs=XD_QUIZ.map(function(q,i){
        var idx=q.o.map(function(_,j){return j});
        for(var k=idx.length-1;k>0;k--){ var r=(i*7+k*13+5)%(k+1); var t=idx[k]; idx[k]=idx[r]; idx[r]=t; }
        return {q:q.q, e:q.e, order:idx, c:idx.indexOf(q.c), o:idx.map(function(j){return q.o[j]})};
      });
      DEMOS['xd']._qs=qs;
      return '<div class="demo"><div class="quiz">'+
        qs.map(function(q,i){
          return '<div class="qz" data-i="'+i+'">'+
            '<div class="qn">문항 '+(i+1)+' / 5</div>'+
            '<div class="qq">'+q.q+'</div>'+
            '<div class="opts">'+q.o.map(function(o,j){
              return '<button class="op2" data-q="'+i+'" data-o="'+j+'">'+o+'</button>';
            }).join('')+'</div></div>';
        }).join('')+
        '</div>'+
        '<div class="code-out locked" id="xd-out">'+
          '<span class="k">완료 코드</span>'+
          '<span class="h" id="xd-h">5문항을 전부 맞히면 열린다. 틀려도 정답과 이유는 그 자리에서 보인다.</span>'+
        '</div></div>';
    },
    init:function(){
      var qs=DEMOS['xd']._qs, done=[], right=0;
      [].forEach.call(document.querySelectorAll('.op2'),function(b){
        b.onclick=function(){
          var qi=+b.getAttribute('data-q'), oi=+b.getAttribute('data-o');
          if(done[qi]) return;
          done[qi]=true;
          var q=qs[qi], box=document.querySelector('.qz[data-i="'+qi+'"]');
          [].forEach.call(box.querySelectorAll('.op2'),function(x,j){
            x.disabled=true;
            if(j===q.c) x.classList.add('right');
            else if(j===oi) x.classList.add('wrong');
          });
          if(oi===q.c) right+=1;
          var e=document.createElement('div'); e.className='exp';
          e.innerHTML=(oi===q.c?'<b>맞다.</b> ':'<b>아니다.</b> ')+q.e;
          box.appendChild(e);

          var out=$('xd-out');
          if(done.filter(Boolean).length<5){
            $('xd-h').textContent=done.filter(Boolean).length+' / 5 풀었다. 맞힌 것 '+right+'개.';
            return;
          }
          if(right===5){
            out.className='code-out open';
            out.innerHTML='<span class="k">완료 코드</span><span class="c">'+XD_CODE+'</span>'+
              '<span class="h">실제 게이트에서는 이 코드를 CLI에 붙여넣어야 다음으로 넘어간다. 판정은 기억이 아니라 <code>gate.py</code>가 원장과 대조해서 한다.</span>';
          } else {
            $('xd-h').innerHTML='<b>'+right+' / 5.</b> 완료 코드는 열리지 않는다. 위의 설명을 읽고 글을 다시 보는 편이 빠르다. '+
              '실제 게이트도 같다. 틀리면 통과가 기록되지 않는다.';
          }
        };
      });
    }
  };

  /* ═══════════════════ 데모 8: 타입 스왑 × 번역 개입 ═══════════════════
     실제 DOM 호출로 잰 4조합. 시뮬레이션이 아니라 같은 insertBefore 다.
     결과는 결정적이라(조건이 같으면 항상 같음) 그대로 재생한다. */
  var DOM_CASES={};
  ['00','01','10','11'].forEach(function(k){
    var swap=k[0]==='1', tr=k[1]==='1';
    DOM_CASES[k]={
      swap:swap, tr:tr,
      shape: tr?'img, font':'img, #text',
      refParent: tr?'font (옮겨짐)':'button (그대로)',
      result: (swap&&tr)?'NotFoundError':(swap?'정상':'해당 없음'),
      err:(swap&&tr)?"Failed to execute 'insertBefore' on 'Node': The node before which the new node is to be inserted is not a child of this node.":null
    };
  });

  DEMOS['dom']={
    html:function(){
      return '<div class="demo">'+
        '<div class="ctrls">'+
          '<div class="field"><label id="dm-a">아이콘 타입을 바꾸나</label><div class="seg" role="group" aria-labelledby="dm-a">'+
            '<button data-g="swap" data-v="0" aria-pressed="true">안 바꿈</button>'+
            '<button data-g="swap" data-v="1" aria-pressed="false">img → svg</button>'+
          '</div></div>'+
          '<div class="field"><label id="dm-b">브라우저 번역이 켜져 있나</label><div class="seg" role="group" aria-labelledby="dm-b">'+
            '<button data-g="tr" data-v="0" aria-pressed="true">꺼짐</button>'+
            '<button data-g="tr" data-v="1" aria-pressed="false">켜짐</button>'+
          '</div></div>'+
        '</div>'+
        '<div class="cards">'+
          '<div class="card"><h3>button의 자식</h3><div id="dm-shape" style="font-family:var(--mono);font-size:13px"></div><div class="hint">번역이 텍스트를 감싸면 바뀐다</div></div>'+
          '<div class="card"><h3>기준 노드의 부모</h3><div id="dm-ref" style="font-family:var(--mono);font-size:13px"></div><div class="hint">렌더 때 기억해 둔 그 노드</div></div>'+
        '</div>'+
        '<div class="log" id="dm-log"></div>'+
        '<div class="verdict pending" id="dm-v"></div>'+
      '</div>';
    },
    init:function(){
      var swap='0', tr='0';
      function paint(){
        var c=DOM_CASES[swap+tr];
        $('dm-shape').textContent=c.shape;
        $('dm-ref').innerHTML='<span style="color:var(--'+(c.tr?'danger':'ink')+')">'+c.refParent+'</span>';
        var L=[];
        L.push({c:'l-dim', s:'// 렌더: 기준 노드를 기억해 둔다'});
        L.push({c:'l-t1',  s:'const ref = button.childNodes[1]'});
        if(c.tr){ L.push({c:'l-dim', s:'// 번역기가 텍스트 노드를 감싼다'});
                  L.push({c:'l-t2',  s:'font.appendChild(textNode)'}); }
        if(c.swap){ L.push({c:'l-dim', s:'// 커밋: 기억해 둔 기준으로 삽입'});
                    L.push({c:c.err?'l-err':'l-ok', s:'button.insertBefore(svg, ref)'}); }
        if(c.err) L.push({c:'l-err', s:'✕ NotFoundError'});
        $('dm-log').innerHTML=L.map(function(x){return '<div class="'+x.c+'">'+x.s+'</div>'}).join('');
        var v=$('dm-v');
        if(c.err){ v.className='verdict violate';
          v.innerHTML='<div><b>NotFoundError</b>'+c.err+'</div>'; }
        else if(c.swap&&!c.tr){ v.className='verdict safe';
          v.innerHTML='<div><b>정상</b>타입 스왑만으로는 안 터진다. 기준 노드가 여전히 button의 직계 자식이다.</div>'; }
        else if(!c.swap&&c.tr){ v.className='verdict safe';
          v.innerHTML='<div><b>아무 일도 없다</b>번역만으로는 안 터진다. 기준 노드의 부모가 바뀌었지만 <strong>그 기준을 쓰는 코드가 안 돈다.</strong></div>'; }
        else { v.className='verdict pending';
          v.innerHTML='<div><b>대기</b>두 조건을 각각 켜보고, 마지막에 둘 다 켜보자.</div>'; }
      }
      [].forEach.call($('dm-log').parentNode.querySelectorAll('.seg button'),function(b){
        b.onclick=function(){
          var g=this.getAttribute('data-g'), v=this.getAttribute('data-v');
          if(g==='swap') swap=v; else tr=v;
          [].forEach.call(this.parentNode.children,function(x){x.setAttribute('aria-pressed',String(x===b))});
          paint();
        };
      });
      paint();
    }
  };

  DEMOS['write-skew']={html:demoHTML,init:initDemo};

  render();
})();
</script>
